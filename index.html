<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* iPhone 防放大（全 App 統一，主任 2026-10-17）：iPhone／iPad 點輸入框不自動放大，兩指放大照常；Android 不加 maximum-scale（會連兩指放大都鎖掉） */
(function(){var m=document.querySelector('meta[name=viewport]');if(m&&(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&m.content.indexOf('maximum-scale')<0)m.content+=',maximum-scale=1';})();</script>
<style>html,body,*{touch-action:manipulation}/* 連點兩下不放大，兩指放大照常 */</style>
<meta name="robots" content="noindex,nofollow">
<title>急診點數</title>
<script>
// iPhone 的主畫面 App 有自己獨立的儲存空間，記不住個人查看連結；所以個人連結（#me=…）在 iPhone 上不掛 manifest，
// 「加入主畫面」存下來的就會是含 # 的完整網址（有 manifest 時 iOS 只存 start_url，圖示打開會變成空白的首次設定畫面）。
// 其他情況（主任自己用、Android）照常掛 manifest，才能安裝成獨立視窗的 App。
// window.VIEW_ONLY＝這一頁是從 me.html（個人查看專用入口）載進來的，用另一份 manifest（start_url 指回 me.html）。
(function(){
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var me=window.VIEW_ONLY||/[#&]me=[A-Za-z0-9_-]{64}/.test(location.hash);
  if(ios&&me) return;
  document.write('<link rel="manifest" href="'+(window.VIEW_ONLY?'manifest-me.json':'manifest.json')+'">');
})();
</script>
<meta name="theme-color" content="#1a4a7a">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急診點數">
<script>
// PWA：只在正式網站註冊 Service Worker（本機 file:// 與 localhost 測試不註冊，免得測到快取的舊版）
if('serviceWorker' in navigator && location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller; let reloading=false;
  // 新版 Service Worker 接手時自動重新整理（第一次安裝不用）
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!had||reloading) return; reloading=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}); });
}
</script>
<style>
:root{--navy:#1a4a7a;--navy-dark:#12355a;--bg:#f3f6fa;--card:#fff;--line:#dfe6ee;--txt:#1f2d3d;--mut:#6b7a8c;

*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
header.top h1 .sub{font-size:12.5px;font-weight:400;opacity:.75;margin-left:8px}
.status{font-size:12.5px}
main.wrap{padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--mut);margin-top:2px}
/* 最下面固定一條：‹ 月份 ›，點中間跳出月曆式的月份選單 */
#monthbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(18,53,90,.08);
  display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.mb-nav{font:inherit;font-size:22px;line-height:1;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.mb-nav:disabled{opacity:.3;cursor:default}
.mb-cur{font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--navy);border:none;border-radius:999px;padding:9px 18px;min-width:190px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.mb-cur i,.mpick i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#c5ced9}
.mb-cur i.done,.mpick i.done{background:#2eb872}.mb-cur i.part,.mpick i.part{background:#f2a541}.mb-cur i.none,.mpick i.none{background:#e2574c}
.mpick{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:31;display:none;justify-content:center;padding:0 12px}
.mpick.on{display:flex}
.mpick .box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(18,53,90,.25);padding:12px 14px;width:100%;max-width:380px}
.mpick .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:17px;color:var(--navy-dark)}
.mpick .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mpick .m{font:inherit;font-size:15px;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px}
.mpick .m:disabled{color:#c2cad4;background:#f7f9fb;cursor:default}
.mpick .m.now{border-color:var(--navy)}
.mpick .m.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.mpick .lg{font-size:12px;color:var(--mut);display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.mpick .lg i{margin-right:4px}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:7px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy-dark)}
.btn.outline{background:#fff;color:var(--navy)}
.btn.outline:hover{background:#eef3f9}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45)}
.btn.light:hover{background:rgba(255,255,255,.26)}
.btn.mini{font-size:12.5px;padding:3px 10px;border-radius:6px}
.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
.btn.ghost:hover{background:#f1f4f8;color:var(--txt)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card>h2{font-size:16.5px;margin:0 0 4px;color:var(--navy-dark);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>h2 .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card .hint{font-size:12.5px;color:var(--mut);margin:2px 0 10px}
details.card>summary{cursor:pointer;font-weight:700;color:var(--navy-dark);font-size:15.5px}
details.card[open]>summary{margin-bottom:12px}
.mhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.mhead h2{font-size:22px;margin:0;color:var(--navy-dark)}
.mhead .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .l{font-size:12.5px;color:var(--mut)}
.tile .v{font-size:25px;font-weight:700;color:var(--navy-dark);font-variant-numeric:tabular-nums;line-height:1.25}
.tile .s{font-size:12.5px;color:var(--mut)}
.tile.ok .v{color:var(--ok)}.tile.due .v{color:var(--bad)}
.tiles.sales{grid-template-columns:repeat(2,minmax(0,1fr))}
.today{font:inherit;width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;cursor:pointer;margin-bottom:12px;
  background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 16px}
.today:hover{background:var(--navy-dark)}
.today .tl{font-size:14px;font-weight:600}.today .tl small{font-weight:400;opacity:.75;margin-left:6px;font-size:12.5px}
.today .tv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.today .tv small{font-size:13px;font-weight:400}
.today .tr{margin-left:auto;font-size:13px;opacity:.9}
.tile.big{background:#e9f1fb;border-color:#d3e3f6;text-align:center;padding:14px}
.tile.big .v{font-size:32px}
.tile.big .l{font-size:14px;color:var(--navy-dark);font-weight:600}
.up{color:var(--ok);font-weight:700}.dn{color:var(--warn);font-weight:700}
.est{display:inline-block;font-size:11px;font-weight:400;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.estit{font-size:11.5px;color:var(--mut);white-space:normal}
.estit.gsub{text-align:right;white-space:nowrap}
.tile.clk{cursor:pointer;position:relative}
.tile.clk:hover{border-color:#8fb1d6;box-shadow:0 2px 10px rgba(26,74,122,.12)}
.tile .tg{position:absolute;top:7px;right:10px;font-size:13px;opacity:.6}
.trend{display:block;width:100%;max-width:560px;height:auto;margin:6px auto 10px}
.mixbar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0 8px;background:#e8edf3}
.mixbar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:3px}
.mixbar span+span{border-left:2px solid #fff}
.mixh{font-weight:700;color:var(--navy-dark);font-size:14px;margin:6px 0 0}
.pr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pr i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.pr .pl{flex:1;min-width:0}.pr .pl small{color:var(--mut);margin-left:6px;font-size:12px}
.pr .pv{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .pp{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.pr.z{opacity:.45}.pr.tot{border-bottom:none;font-weight:700}.pr.tot .pv{color:var(--txt)}
details.sec>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16.5px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--mut);font-size:15px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .sum-amt{font-variant-numeric:tabular-nums;color:var(--navy)}
details.sec>summary .tag{margin-left:auto}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec-head .hint{margin:0;flex:1 1 240px}
.bar{height:6px;border-radius:3px;background:#e8edf3;margin-top:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:#2eb872}
.note{border-radius:9px;padding:9px 13px;font-size:13.5px;margin-bottom:10px}
.note.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d9a4}
.note.bad{background:var(--badbg);color:var(--bad);border:1px solid #f1b9b3}
.note.big{background:#fff8e1;color:#5a4300;border:1px solid #f2c94c}
.note.big .bigt{font-weight:700;margin-bottom:2px}.note.big .bigl{padding:2px 0;font-size:15px}.note.big .bigl small{margin-left:8px;color:var(--mut);font-size:12px}
.note.info{background:#eaf2fb;color:var(--navy-dark);border:1px solid #c9dcf0}
.note ul{margin:0;padding-left:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f4f7fb;color:var(--navy-dark);font-weight:700;font-size:13px}
th.l,td.l{text-align:left}
td.n{font-variant-numeric:tabular-nums}
td.amt{font-weight:700;font-variant-numeric:tabular-nums}
td.z{color:#b8c1cc}
tr.tot td{font-weight:700;background:#f4f7fb;border-top:2px solid var(--line)}
tr.bgrp td{font-weight:700;color:var(--navy);background:#f4f7fb;padding-top:7px;padding-bottom:7px}
tr.bad td{background:var(--badbg)}
tr.paid td.amt{color:var(--ok)}
.nm{font:inherit;background:none;border:none;padding:0;color:var(--navy);cursor:pointer;font-weight:600;border-bottom:1px dashed #9db6d1}
.nm:hover{color:var(--navy-dark);border-bottom-style:solid}
.tag{display:inline-block;font-size:12.5px;border-radius:6px;padding:2px 8px;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut)}
.pdate{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;color:var(--txt);width:128px}
.diff{font-size:12.5px;color:var(--warn);margin-top:3px;white-space:normal}
td.st{text-align:left;min-width:250px}
.sub2{font-size:12.5px;color:var(--mut);margin-top:8px}
#rates-view input[type=number]{width:104px;font-size:15px;font-weight:700;color:var(--navy-dark);border-color:#8fb1d6;background:#fbfdff}
#rates-view td,#rates-view th{padding-top:6px;padding-bottom:6px}
#rates-note .note{margin:10px 0 0}
#rates-view input.chg{border-color:#f2a541;background:#fff8ea}
h3{font-size:14px;color:var(--navy-dark);margin:18px 0 8px;border-left:3px solid var(--navy);padding-left:8px}
h3:first-child{margin-top:0}
input[type=number],input[type=text],input[type=url]{font:inherit;font-size:14px;border:1px solid #c7d2df;border-radius:6px;padding:4px 8px}
input[type=number]{width:92px;text-align:right}
.brsel{font:inherit;font-size:14px;border:1px solid #c7d2df;border-radius:6px;padding:4px 6px;background:#fff;max-width:120px}
.brnew{display:inline-flex;gap:4px;align-items:center}.brnew .brin{width:96px}
input:focus{outline:2px solid #9cc0e6;outline-offset:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:#eaf2fb;border:1px solid #c9dcf0;border-radius:999px;padding:3px 6px 3px 12px;font-size:14px;display:flex;align-items:center;gap:4px}
.chip button{font:inherit;border:none;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:50%}
.chip button:hover{background:#d5e4f4;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ycell{font-variant-numeric:tabular-nums}
.ycell.p{color:var(--ok)}.ycell.u{color:var(--bad);font-weight:700}.ycell.w{color:var(--warn);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(18,53,90,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 4px;font-size:18px;color:var(--navy-dark);display:flex;align-items:center}
.dlg h2 .btn{margin-left:auto}
.dlg .cumh{font-weight:700;color:var(--navy-dark);font-size:14.5px;margin:12px 0 0}
.dlg .cumh small{font-weight:400;color:var(--mut);margin-left:6px}
.hru{font-size:12px;color:var(--mut);font-weight:400}
.lg2{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--txt);margin:-4px 0 8px}
.lg2 i{display:inline-block;width:24px;border-top:3px solid var(--navy);vertical-align:middle;margin-right:6px}.lg2 i.d{border-top:2px dashed #2a9d8f}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#sync-st{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap}
#sync-st.bad{background:#b3261e;border-color:#b3261e;color:#fff}
.setup{max-width:560px;margin:0 auto}
.setup h2{font-size:18px;color:var(--navy-dark);margin:0 0 6px}
input[type=password]{font:inherit;font-size:15px;border:1px solid #c7d2df;border-radius:6px;padding:6px 10px}
pre.rule{background:#0f2238;color:#e8f0fa;border-radius:8px;padding:10px 12px;font-size:12.5px;overflow:auto;white-space:pre;user-select:all;margin:8px 0 0}
@media (max-width:640px){
  .card{padding:12px}.tile .v{font-size:21px}th,td{padding:6px 7px}
  /* 手機：小數字磚一排兩個（單數時最後一個佔整排），少滑一點 */
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tiles:not(.sales) .tile:last-child:nth-child(odd){grid-column:1/-1}
  .tile{padding:10px 12px}.tile.big{padding:12px 8px}.tile.big .v{font-size:27px}
  header.top{position:static}
  header.top h1 .sub{display:none}
  /* 手機：醫師／專師表改成一人一塊（姓名＋點數／件數／確認按鈕），不用左右捲 */
  table.ppl,table.ppl tbody{display:block}
  table.ppl thead{display:none}
  table.ppl tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.ppl td{display:block;border:none;padding:0;text-align:left;white-space:normal;background:none!important}
  table.ppl td.nmc{order:1;flex:1 1 auto;font-size:16px}
  table.ppl td.amt{order:2;margin-left:auto;font-size:16px}
  table.ppl tr::before{content:'';order:3;flex-basis:100%;height:0}
  table.ppl td.q,table.ppl td.sub{order:4;font-size:12.5px;color:var(--mut)}
  table.ppl td.q::before,table.ppl td.sub::before{content:attr(data-l) ' '}
  table.ppl td.z{display:none}
  table.ppl tr::after{content:'';order:5;flex-basis:100%;height:0}
  table.ppl td.st{order:6;min-width:0;flex-basis:100%;margin-top:5px}
  table.ppl td.st:empty{display:none}
  table.ppl tr.tot{background:#f4f7fb;border-radius:8px;padding:10px 8px;border-bottom:none}
  table.ppl tr.bad{background:var(--badbg)}
  .pdate{width:120px}
  /* 手機：每件點數表改成一個品項一塊（品項＋廠牌一行，六個輸入格兩欄排，下面一行是自動加總），不用左右捲 */
  table.rates,table.rates tbody{display:block}
  table.rates thead{display:none}
  table.rates tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  table.rates td{display:block;border:none;padding:0;text-align:left;white-space:normal}
  table.rates td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
  table.rates td.rn{font-size:16.5px;align-self:center}
  table.rates td.rb{text-align:right}
  table.rates td.rc{font-size:13.5px}
  table.rates td.rc:last-child{grid-column:1/-1}
  #rates-view table.rates input[type=number]{width:100%}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>急診點數<span class="sub">每月統計・確認註記</span></h1>
</div></header>

<main class="wrap">
  <div id="alerts"></div>
  <div id="month-top"></div>
  <details class="card" id="card-rates" data-sec="rates"><summary>✏ 每件點數（可直接修改）</summary><div id="rates-view"></div></details>
  <div id="month-view"></div>
  <div id="inv-view"></div>
  <details class="card" id="card-year"><summary>年度總覽：每個人每個月的點數與確認狀況</summary><div id="year-view"></div></details>
  <details class="card" id="card-cfg"><summary>⚙ 其他設定：雲端同步／試算表網址／備份</summary><div id="cfg-view"></div></details>
  <div class="foot"><span class="status" id="status"></span><span class="status" id="sync-st" data-act="goto-sync"></span>
    <button class="btn mini ghost" id="btn-refresh" data-act="refresh">🔄 更新</button></div>
</main>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>

<script>

  try{

    const u=Uint8Array.from(b,ch=>ch.charCodeAt(0));

// VIEW：null＝主任模式；{id,key,tok}＝個人查看；{none:true}＝個人查看入口但還沒有代碼（請他貼連結）

    return (tok||saved?parseViewTok(tok||saved):null)||{none:true};
  }
  if(location.protocol==='file:') return tok?parseViewTok(tok):null;   // 本機檔沒辦法用 me.html，維持舊做法（只有主任自己會這樣開）
  // 只有網址帶著個人代碼才轉去 me.html。這台裝置只是「記著」某個人的代碼時不自動轉——
  // 主任在自己的裝置上試開過專師連結的話，會變成一打開就是那位專師的頁面、找不到登入的地方
  if(tok){ location.replace('me.html#me='+tok); return {none:true}; }

})();
let _notice=null; if(!VIEW){ try{ _notice=localStorage.getItem(LS_NOTICE); }catch(e){} }
let viewInfo=null, viewErr=null, _mePicked=false;   // viewInfo＝解開的個人資料；viewErr＝'gone' 連結失效｜'net' 連不上
const isDocView=()=>!!(viewInfo&&viewInfo.role==='d');   // 個人查看頁是醫師的（否則是專師的）
const mePk=()=>(isDocView()?'d|':'n|')+(viewInfo?viewInfo.name:'');
const PRODUCTS=[
  {id:'dressing',name:'水性',  re:/^(?!.*銀).*(敷料|水性)/},   // 「銀離子…敷料」是另一個品項，不可算進來
  {id:'scar',    name:'除疤',  re:/疤(?!.*(膠片|貼片))/},   // 試算表「疤痕凝膠」；「疤痕膠片／除疤貼片」是另一個品項，不可算進來
  {id:'glue',    name:'黏著',  re:/黏著|黏合/},
  {id:'repair',  name:'修護液',re:/修護/},
  {id:'film',    name:'膠片',  re:/^(?!.*銀).*(膠片|貼片)/},   // 試算表「疤痕膠片」（10月分頁起）
  {id:'silver',  name:'銀泡棉(大)',re:/^(?!.*小).*銀/},   // 欄名有「銀」、沒有「小」：11月起分大小，「銀泡棉」「銀泡棉(大)」都算這一項（id 沿用原本的 silver，點數與廠牌設定留著）
  {id:'silverS', name:'銀泡棉(小)',re:/^(?=.*銀).*小/},   // 試算表 11月分頁「銀泡棉(小)」
];
// 各品項屬於哪個廠牌：主任在「每件點數」表自己選（cfg.brand={m:{品項:廠牌},t}，跟著加密同步，所以廠牌名稱不會出現在網頁檔裡）。
// 選了之後主畫面多一塊「該廠牌 總點數」，點開「總點數」也會分廠牌
const brandOf=pid=>((state.cfg.brand&&state.cfg.brand.m)||{})[pid]||'';
function brandList(){ const out=[]; productList().forEach(p=>{ const b=brandOf(p.id); if(b&&!out.includes(b)) out.push(b); }); return out; }
const BRAND_COLOR=['#1a4a7a','#c0504d','#2e9e6b','#ed7d31','#8e6bb5','#c9a34a'];
const brandColor=b=>{ const i=brandList().indexOf(b); return i<0?'#b8c2cc':BRAND_COLOR[i%BRAND_COLOR.length]; };
let brandNew={};   // 每件點數表裡正在輸入新廠牌名稱的品項（只在記憶體）
// 每一件的點數怎麼分：doc 醫師、promo 主要、pool 放進專師平分池、fund 科部（不屬於個人）；
// price＝每件的品項點數，只用來算「品項總點數」；cost＝每件的原始點數，只用來算「原始總點數」「總點數差」與「折讓點數」。兩個都不影響每個人的點數
const FIELDS=['doc','promo','pool','fund','price','cost'];
const ZERO={doc:0,promo:0,pool:0,fund:0,price:0,cost:0};
// 哪幾張卡展開著
const LS_UI='erCommission_ui2';
let ui={};   // 只在這次開啟期間記住（重畫時不會彈回去）；不存到裝置上，所以每次打開 App 都是全部收起來
try{ localStorage.removeItem(LS_UI); }catch(e){}   // 清掉舊版存過的展開紀錄
const isOpen=sec=>ui[sec]===true;   // 預設全部收合；使用者自己展開過的才記成展開
const shiftKey=(k,d)=>{ let [y,m]=k.split('-').map(Number); m+=d; while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; } return `${y}-${pad(m)}`; };
const FUND_PK='f|科部', OLD_FUND_PK='f|\u79d1\u57fa\u91d1';   // OLD＝改名前存的鍵，讀到就搬成新的
function moveOldFundKey(paid){ const o=paid[OLD_FUND_PK]; if(!o) return; if(!paid[FUND_PK]||(o.t||0)>(paid[FUND_PK].t||0)) paid[FUND_PK]=o; delete paid[OLD_FUND_PK]; }
const defRate=pid=>(window.COMMISSION_DEFAULT_RATES||{})[pid]||ZERO;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const keyLabel=k=>{ const [y,m]=k.split('-').map(Number); return `${y}年${m}月`; };
const shortDate=s=>{ const m=String(s||'').match(/^\d{4}-(\d{2})-(\d{2})$/); return m?`${+m[1]}/${+m[2]}`:''; };
const normName=v=>String(v==null?'':v).replace(/\s+/g,'');
const sumVals=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);

function loadState(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){}
  return normState(s||{});
}
function normState(s){
  s.cfg=s.cfg||{}; s.cfg.rates=s.cfg.rates||{};
  s.cfg.views=s.cfg.views||{};   // 個人查看連結 {鍵:{tok,t}｜{del:1,t}}；鍵＝專師的姓名，醫師是 'd|姓名'
  s.cfg.rateSets=s.cfg.rateSets||{};   // 各月自己的每件點數 {'115-10':{r:{品項:{…}},t}｜{del:1,t}}，見 ratesFor()
  s.cfg.hist=s.cfg.hist||{};   // 試算表開始記錄以前的月份 {'115-01':{cost,it:{品項:件數},t}｜{del:1,t}}，只給折線圖用，見 histOf()
  if(!Array.isArray(s.cfg.sharers)) s.cfg.sharers=null;   // null＝跟著試算表統計頁的專師名單
  s.cfg.big=s.cfg.big||{on:true,min:5000,t:0};   // 單筆通知：on＝要不要發、min＝單筆品項點數的門檻（主任端設定，會同步、也會帶進個人連結）
  s.led=s.led||{};   // 醫師累積點數的確認紀錄 {id:{pk:'d|姓名',amt,at,note,t}｜{del:1,t}}，見 docCumAll()
  s.data=s.data||{}; s.data.months=s.data.months||{}; s.data.extra=s.data.extra||{};
  s.data.roster=s.data.roster||{}; s.data.roster.np=s.data.roster.np||[]; s.data.roster.doc=s.data.roster.doc||[];
  pruneExtra(s.data);
  // {'115-09':{cfg:{products,sharers}（第一次註記時的設定快照）,cfgT,paid:{'d|姓名':{amt,at,t}｜{del:1,t}}}}
  // t／cfgT＝最後修改時間（毫秒），跨裝置合併時較新的為準；取消註記留 {del:1,t} 才能同步到別台。舊資料補 1。
  s.pay=s.pay||{};
  Object.keys(s.pay).forEach(k=>{ const pm=s.pay[k]||(s.pay[k]={}); pm.paid=pm.paid||{};
    if(pm.cfg&&!pm.cfgT) pm.cfgT=1;
    Object.keys(pm.paid).forEach(pk=>{ if(!pm.paid[pk].t) pm.paid[pk].t=1; });
    moveOldFundKey(pm.paid); });
  return s;
}
// local=true：只是試算表快取或雲端合併結果，不用再推上雲端
function saveState(local){
  if(VIEW) return true;   // 個人查看模式什麼都不存
  try{ localStorage.setItem(LS,JSON.stringify(state)); }
  catch(e){ alert('資料寫入失敗（'+(e&&e.message||e)+'）。請先到最下方「其他設定」匯出備份。'); return false; }
  if(!local) schedulePush();
  return true;
}
let state=VIEW?normState({}):loadState();
if(VIEW) state.cfg.big={on:false,min:0,p:{}};   // 個人頁：等解開主任放的內容才知道要不要通知
let cur=null;        // 目前檢視的月份 key（民國年-月，例 115-09）
let yearSel=null;
let busy=false, fail=null, delta=null;

// ---------- 設定 ----------
function sheetUrl(){ return state.cfg.url||window.COMMISSION_SHEET_URL||''; }
// data.extra＝試算表裡認不得、但確定是數字欄的欄名，每一個會在「每件點數」多列一個品項。
// 以前讀到過就一直留著，所以欄名後來改成認得的、或那一欄已經不在試算表上，同一個品項就會列兩次（例如兩個「水性」）。
// 現在只留「資料裡真的有件數、而且現在還認不得」的欄名。
function pruneExtra(D){
  const used={};
  Object.values(D.months||{}).forEach(m=>((m&&m.rows)||[]).forEach(r=>Object.keys((r&&r.it)||{}).forEach(pid=>used[pid]=1)));
  Object.keys(D.extra||{}).forEach(l=>{ if(!used['x:'+l]||PRODUCTS.some(p=>p.name===l||p.re.test(l))) delete D.extra[l]; });
}
function productList(){
  return PRODUCTS.map(p=>({id:p.id,name:p.name}))
    .concat(Object.keys(state.data.extra).map(l=>({id:'x:'+l,name:l})));
}
const prodName=pid=>{ const p=PRODUCTS.find(p=>p.id===pid); return p?p.name:String(pid).replace(/^x:/,''); };
function liveRates(){
  const o={};
  productList().forEach(p=>{ const u=state.cfg.rates[p.id]||{}, d=defRate(p.id); o[p.id]={};
    FIELDS.forEach(f=>{ o[p.id][f]=(u[f]!=null&&u[f]!=='')?Math.max(0,Number(u[f])||0):(Number(d[f])||0); }); });
  return o;
}
function liveSharers(){ return (state.cfg.sharers||state.data.roster.np||[]).slice(); }
// 每件點數可以每個月不同。某個月存過自己的一組（cfg.rateSets[月]）時，從那個月起適用，
// 直到下一個有自己設定的月份為止——沒有另外改的月份，就沿用前面最近的那一組。
// 比所有設定都早的月份用 liveRates()（最初的那一份）。
function rateSetKey(key){   // 這個月實際用的是哪個月存的那一組；null＝最初的設定
  const rs=state.cfg.rateSets||{}, ks=Object.keys(rs).filter(k=>k<=key&&rs[k]&&!rs[k].del).sort();
  return ks.length?ks[ks.length-1]:null;
}
function ratesFor(key){
  const o=liveRates(), sk=key?rateSetKey(key):null;
  if(!sk) return o;
  const r=state.cfg.rateSets[sk].r||{};
  Object.keys(o).forEach(pid=>{ const u=r[pid]; if(!u) return;
    FIELDS.forEach(f=>{ if(u[f]!=null&&u[f]!=='') o[pid][f]=Math.max(0,Number(u[f])||0); }); });
  return o;
}
// 平分池分組：有自己平分名單的廠牌（cfg.bShare）各自一組（組名＝廠牌），其餘品項都在預設那一組（平分名單）。
// 個人頁沒有名單，用主任放上來的分組（組名＝廠牌、名單只有人數，見 viewBlob／applyView）
function poolGroups(){
  if(VIEW) return state.cfg.vg||null;
  const bs=(state.cfg.bShare&&state.cfg.bShare.m)||{}, pg={}, groups={};
  productList().forEach(p=>{ const b=brandOf(p.id); if(b&&Array.isArray(bs[b])&&bs[b].length){ pg[p.id]=b; groups[b]=bs[b].slice(); } });
  return Object.keys(pg).length?{pg,groups}:null;
}
function cfgFor(key){ const o={products:ratesFor(key),sharers:liveSharers()}, g=poolGroups(); if(g){ o.pg=g.pg; o.groups=g.groups; } return o; }
const poolGroupOf=(cfg,pid)=>(cfg&&cfg.pg&&cfg.pg[pid])||'';   // ''＝預設那一組
const groupMembers=(cfg,g)=>g?(((cfg.groups||{})[g])||[]):cfg.sharers;
const inAnyPool=(cfg,name)=>cfg.sharers.includes(name)||Object.values(cfg.groups||{}).some(S=>S.includes(name));
// 有確認紀錄的月份用當時固定下來的設定（pm.cfg）；其餘照 cfgFor
function monthCfg(key){ const pm=state.pay[key]; return (pm&&pm.cfg)||cfgFor(key); }
// 表格上要顯示的：這個月實際在用的每件點數
function monthRates(key){ const cfg=monthCfg(key), live=ratesFor(key), o={}; productList().forEach(p=>{ o[p.id]=rateOf(cfg,p.id,live); }); return o; }
function paidOf(key){   // 只回有效的確認紀錄（取消的 {del:1} 不算）
  const p=(state.pay[key]&&state.pay[key].paid)||{}, o={};
  Object.keys(p).forEach(k=>{ if(!p[k].del) o[k]=p[k]; });
  return o;
}
// 這個月的快照設定和現行設定算出來的點數有沒有差（只是多了別的月份才有的新品項不算）
function snapDiffers(key){
  const pm=state.pay[key]; if(!pm||!pm.cfg) return false;
  const sig=c=>JSON.stringify([people(c).map(p=>p.pk+'='+p.amt).sort(),Math.round(c.sales),Math.round(c.cost)]);   // 品項點數、原始點數不同也算
  return sig(calcMonth(key))!==sig(calcMonth(key,cfgFor(key)));
}

// ---------- 計算 ----------
// 某份設定裡某品項的每件點數。科部、品項點數是後來才加的：舊的月份快照沒有這些欄時先跟著現行設定，
// 等那個月下次有註記動作（ensureMonth）才寫進快照固定下來
function rateOf(cfg,pid,live){
  const r=cfg.products[pid]||ZERO, lv=((live||ratesFor(cur||''))[pid])||ZERO;
  return {doc:Number(r.doc)||0,promo:Number(r.promo)||0,pool:Number(r.pool)||0,
    fund:r.fund!=null?(Number(r.fund)||0):(lv.fund||0), price:r.price!=null?(Number(r.price)||0):(lv.price||0),
    cost:r.cost!=null?(Number(r.cost)||0):(lv.cost||0)};
}
function calcMonth(key,cfgOverride){
  const md=state.data.months[key], cfg=cfgOverride||monthCfg(key), live=ratesFor(key), rc={};
  const c={key,cfg,rows:(md&&md.rows)||[],gone:!!(md&&md.gone),prod:{},doc:{},np:{},pool:0,poolG:{},poolBm:{},fund:0,fundIt:{},vendor:0,units:0,sales:0,cost:0,noPrice:{},zeroRate:{},bv:{},bs:{}};   // poolG＝各平分組的池；poolBm＝預設那一組的池按廠牌分   // bv／bs＝各廠牌的總點數／品項總點數（'' 是還沒選廠牌的品項）
  c.rows.forEach(r=>Object.keys(r.it).forEach(pid=>{
    const q=r.it[pid], rt=rc[pid]||(rc[pid]=rateOf(cfg,pid,live)), bk=brandOf(pid);
    if(!cfg.products[pid]||!(rt.doc+rt.promo+rt.pool+rt.fund)) c.zeroRate[pid]=1;
    c.prod[pid]=(c.prod[pid]||0)+q; c.units+=q;
    c.sales+=q*rt.price; if(!rt.price) c.noPrice[pid]=1;
    c.cost+=q*rt.cost;
    c.bv[bk]=(c.bv[bk]||0)+q*(rt.doc+rt.promo+rt.pool+rt.fund);
    c.bs[bk]=(c.bs[bk]||0)+q*rt.price;   // 各廠牌的品項總點數
    const d=c.doc[r.doc]||(c.doc[r.doc]={it:{},amt:0,sales:0}); d.it[pid]=(d.it[pid]||0)+q; d.amt+=q*rt.doc; d.sales+=q*rt.price;
    const n=c.np[r.np]||(c.np[r.np]={it:{},promo:0,share:0,promoB:{}}); n.it[pid]=(n.it[pid]||0)+q; n.promo+=q*rt.promo;
    n.promoB[bk]=(n.promoB[bk]||0)+q*rt.promo;   // 各廠牌的主要點數
    const g=poolGroupOf(cfg,pid); c.poolG[g]=(c.poolG[g]||0)+q*rt.pool; if(!g) c.poolBm[bk]=(c.poolBm[bk]||0)+q*rt.pool;
    c.pool+=q*rt.pool; c.vendor+=q*(rt.doc+rt.promo+rt.pool+rt.fund);
    if(rt.fund){ c.fund+=q*rt.fund; c.fundIt[pid]=(c.fundIt[pid]||0)+q; }
  }));
  // 平分池：各組的池除以該組名單人數（預設那一組＝平分名單），除不盡的零頭（名單是空的時就是整池）歸到科部
  c.shareG={}; c.poolLeft=0;
  [...new Set(['',...Object.keys(c.poolG)])].forEach(g=>{
    const S=groupMembers(cfg,g), N=S.length, p=c.poolG[g]||0, sh=N?Math.floor(p/N):0;
    c.shareG[g]=sh; c.poolLeft+=p-sh*N;
    S.forEach(nm=>{ (c.np[nm]||(c.np[nm]={it:{},promo:0,share:0,promoB:{}})).share+=sh; }); });
  c.share=c.shareG['']||0;   // 預設那一組每人的平分
  c.fund+=c.poolLeft;
  return c;
}

  //  ・跟已採用分頁大半相同 → 是「第一個分頁」的回聲（有人正在輸入，各分頁回應差一兩列）→ 略過
  //  ・只有一個分頁回這份 → 真的分頁 → 各列照 addRows 的規則算
  //  ・好幾個分頁都回這份、又沒有一頁月份對得上 → 無法判斷是哪個月，不計、出提醒
  const gs=Object.values(groups), goodK={};
  gs.forEach(g=>{ if(g.good) g.rows.forEach(r=>goodK[r.k]=(goodK[r.k]||0)+1); });
  const acc={months:{},extra:{},undated:0,mismatch:0,dropped:0,noQty:{},roster:lay.roster}, real=[];
  gs.forEach(g=>{
    if(g.domM!=null&&!g.good){
      const left={...goodK}; let hit=0;
      g.rows.forEach(r=>{ if(left[r.k]>0){ left[r.k]--; hit++; } });
      if(hit>=g.rows.length/2) return;
      if(g.n>1){ acc.dropped+=g.rows.reduce((t,r)=>t+sumVals(r.cnt),0); return; }
    }
    addRows(acc,g.rows.concat(g.blank),g.tabM,g.tabY); g.extra.forEach(l=>acc.extra[l]=1); real.push(g.tab);
  });
  if(!quick) _lay={id,at:now,lay,real};
  return acc;
}

// ---------- 月份鎖住（2026-11-20） ----------
// 主任頁每個月可以「鎖住」：試算表那個月的分頁加保護，其他人不能改；擁有者改的由試算表的 Apps Script 自動改回（網頁程式做，這裡用 JSONP 呼叫）。
// 網址與金鑰放本機設定檔（COMMISSION_LOCK_URL／_KEY，換了就把 COMMISSION_LOCK_VERSION 加 1），跟著加密雲端同步到主任的其他裝置；公開檔裡沒有
let lockBusy=false, lockFail=null;
const lockCfg=()=>{ const l=state.cfg.lock; return l&&l.url&&l.key?l:null; };
function applyLockVer(){

// 本機設定檔交代的一次性調整（各有自己的 VERSION，每個版本只做一次，做完跟著加密雲端同步到其他裝置）：
//  ・COMMISSION_BRAND_SHARERS：{廠牌:[姓名…]}——這個廠牌的品項另外用自己的平分名單（其他品項照原本的平分名單）
//  ・COMMISSION_RATE_PATCH：指定品項的每件點數，套到最初的設定和每個月自己的那一組（已確認的月份照當時的快照不動）；
//    銀泡棉(小)還沒選廠牌時跟著銀泡棉(大)
function applyPatches(){
  const c=state.cfg, now=Date.now(); let ch=false;
  const bv=window.COMMISSION_BRAND_SHARERS_VERSION, bsp=window.COMMISSION_BRAND_SHARERS;
  if(bv&&bsp&&c.bShareV!==bv){
    c.bShare={m:Object.assign({},(c.bShare&&c.bShare.m)||{}),t:now};
    Object.keys(bsp).forEach(b=>{ c.bShare.m[b]=(bsp[b]||[]).map(normName).filter(Boolean); });
    c.bShareV=bv; ch=true;
  }
  const rv=window.COMMISSION_RATE_PATCH_VERSION, rp=window.COMMISSION_RATE_PATCH;
  if(rv&&rp&&c.ratePatchV!==rv){
    const put=o=>Object.keys(rp).forEach(pid=>{ const u=o[pid]||(o[pid]={}); Object.keys(rp[pid]).forEach(f=>{ if(FIELDS.includes(f)) u[f]=Math.max(0,Number(rp[pid][f])||0); }); });
    put(c.rates); c.tR=now;
    Object.keys(c.rateSets||{}).forEach(k=>{ const st=c.rateSets[k]; if(!st||st.del) return; st.r=st.r||{}; put(st.r); st.t=now; });
    if(c.brand&&c.brand.m&&!c.brand.m.silverS&&c.brand.m.silver){ c.brand.m.silverS=c.brand.m.silver; c.brand.t=now; }
    c.ratePatchV=rv; ch=true;
  }

function lockApi(params,timeoutMs){
  const l=lockCfg(); if(!l) return Promise.reject(new Error('還沒設定'));
  return new Promise((resolve,reject)=>{
    const cb='__lock'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const s=document.createElement('script'); let done=false;
    const fin=()=>{ done=true; clearTimeout(t); window[cb]=function(){}; s.remove(); };
    const t=setTimeout(()=>{ if(!done){ fin(); reject(new Error('連線逾時')); } },timeoutMs||30000);
    window[cb]=d=>{ if(done) return; fin(); if(d&&d.ok) resolve(d); else reject(new Error((d&&d.err)||'試算表回傳錯誤')); };
    s.onerror=()=>{ if(!done){ fin(); reject(new Error('連不上試算表')); } };
    s.src=l.url+'?'+new URLSearchParams(Object.assign({cb,k:l.key},params));
    document.head.appendChild(s);
  });
}

// 備援：試算表改成不公開後，改上傳「檔案→下載→Microsoft Excel」的 xlsx
function parseWorkbook(wb){
  const acc={months:{},extra:{},undated:0,mismatch:0,dropped:0,noQty:{},roster:{np:[],doc:[]}};
  wb.SheetNames.forEach(name=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(/統計/.test(name)){ acc.roster=parseRoster(aoa.map(r=>normName(r&&r[0]))); return; }
    const mm=name.match(/(?:(\d{2,3})\s*年\s*)?(\d{1,2})\s*月/), tabM=mm&&+mm[2]>=1&&+mm[2]<=12?+mm[2]:null, tabY=mm&&mm[1]?+mm[1]:null;
    for(let hi=0;hi<Math.min(6,aoa.length);hi++){
      const map={prod:[]};
      (aoa[hi]||[]).forEach((lbl,ci)=>{
        const k=classify(lbl); if(!k) return;
        if(k.kind==='seq'&&map.seq==null) map.seq=ci;
        else if(k.kind==='date'&&map.date==null) map.date=ci;
        else if(k.kind==='np'&&map.np==null) map.np=ci;
        else if(k.kind==='doc'&&map.doc==null) map.doc=ci;
        else if(k.kind==='prod') map.prod.push({ci,pid:k.pid});
        else if(k.kind==='maybe'){
          const vals=aoa.slice(hi+1).map(r=>r&&r[ci]).filter(v=>v!=null&&v!=='');
          if(vals.length&&vals.every(v=>typeof v==='number'||/^\d+(\.\d+)?$/.test(String(v).trim()))) map.prod.push({ci,pid:k.pid,label:k.label});
        }
      });
      if(map.np==null||!map.prod.length) continue;
      const rows=aoa.slice(hi+1).map(r=>{ r=r||[]; const cnt={};
        map.prod.forEach(p=>{ const n=qty(r[p.ci]); if(n) cnt[p.pid]=(cnt[p.pid]||0)+n; });
        return {seq:map.seq!=null?r[map.seq]:null,date:map.date!=null?parseDate(r[map.date]):null,cnt,np:r[map.np],doc:map.doc!=null?r[map.doc]:null}; });
      addRows(acc,rows.filter(r=>!isInvRow(r)),tabM,tabY);
      map.prod.forEach(p=>{ if(p.label) acc.extra[p.label]=1; });
      break;
    }
  });
  return acc;
}
// 每次都是整份讀，所以「這次涵蓋的年度」裡原本有、這次沒有的月份要清掉（試算表刪列／誤判月份才不會殘留）；
// 但已有確認紀錄的月份不清，保留最後一次讀到的內容並標 gone，免得對不回去。其他年度原封不動。
function mergeResult(acc,source){
  const D=state.data, keys=Object.keys(acc.months).sort();
  const cnt=k=>D.months[k]?D.months[k].rows.reduce((t,r)=>t+sumVals(r.it),0):0;
  const before=JSON.stringify([D.months,D.roster,D.extra]), cntBefore={};
  Object.keys(D.months).forEach(k=>cntBefore[k]=cnt(k));
  if(keys.length){
    const yrs=new Set(keys.map(k=>k.split('-')[0]));
    Object.keys(D.months).forEach(k=>{ if(!yrs.has(k.split('-')[0])||acc.months[k]) return;
      if(Object.keys(paidOf(k)).length) D.months[k].gone=true; else delete D.months[k]; });
    keys.forEach(k=>{ D.months[k]={rows:acc.months[k].rows}; });
  }
  if(acc.roster.np.length) D.roster=acc.roster;
  Object.assign(D.extra,acc.extra); pruneExtra(D);
  const changed=JSON.stringify([D.months,D.roster,D.extra])!==before, now=new Date().toISOString();
  D.checked=now; if(changed||!D.changed) D.changed=now;
  D.source=source; D.warn={undated:acc.undated,mismatch:acc.mismatch,dropped:acc.dropped||0,noQty:acc.noQty||{}};
  saveState(true);
  const dl=[...new Set([...Object.keys(cntBefore),...Object.keys(D.months)])].sort().map(k=>{

let _refreshAgain=false;
async function refresh(silent,full){
  if(busy){ _refreshAgain=true; return; }   // 正在讀：讀完再讀一次（例如剛換了試算表網址）
  if(VIEW&&!sheetUrl()){ loadView(); return; }
  const url=sheetUrl();
  if(!url){ if(!silent){ $('card-cfg').open=true; alert('還沒設定試算表網址，請到最下方「其他設定」貼上。'); } renderStatus(); return; }
  busy=true; renderStatus();
  try{
    const r=mergeResult(await fetchSheet(url,full||!silent),'sheet');   // 按「更新」＝整份重讀；自動的只讀有資料的分頁
    fail=null; if(r.delta) delta={txt:r.delta,at:Date.now()};
    const ic=VIEW?false:await refreshInv(url);   // 庫存（只有主任頁）；讀失敗不影響點數
    const lc=VIEW?false:await refreshLocks();    // 哪幾個月鎖住了（只有主任頁）
    const pc=VIEW?false:applyPatches();          // 名單讀到之後才能套的一次性調整
    if(pc) saveState();
    busy=false;
    loadSched();
    if(r.changed||pc) publishViews();
    if(r.changed||ic||lc||pc||!silent||!cur) renderAll(); else renderStatus();
  }catch(e){
    busy=false; fail={at:new Date().toISOString(),msg:(e&&e.message)||String(e)};
    renderStatus(); if(!silent) alert('讀取試算表失敗：'+fail.msg+'\n\n畫面上保留的是上次讀到的資料。');
  }
  if(_refreshAgain){ _refreshAgain=false; setTimeout(()=>refresh(true),100); }
}

function monthWarnings(c,list){

  if(noNp) w.push(`有 ${noNp} 件沒填專師，主要點數 ${fmt(c.np[''].promo)} 沒有對應的人——請回試算表補上再按更新。`);
  if(noDoc) w.push(`有 ${noDoc} 件沒填醫師，醫師點數 ${fmt(c.doc[''].amt)} 沒有對應的人——請回試算表補上再按更新。`);

  const oddNp=Object.keys(c.np).filter(n=>n&&!known.has(n)&&sumVals(c.np[n].it));
  if(oddNp.length&&known.size) w.push(`專師「${oddNp.join('、')}」不在名單上，請確認是不是打錯字（有主要點數、但不參加平分）。`);

  if(zr.length) w.push(`品項「${zr.map(prodName).join('、')}」還沒設定點數（目前以 0 計），請在「每件點數」那張表填上。`);

  if(!c.cfg.sharers.length&&c.pool) w.push(`平分名單是空的，專師平分池 ${fmt(c.pool)} 點全部歸到科部了——請在「每件點數」下方的平分名單加入姓名。`);

function renderYear(){

      colTot[k].due+=p.amt; if(p.role!=='d') colTot[k].owe+=Math.max(0,p.amt-(p.rec?p.rec.amt:0)); }); });   // 醫師改用累積點數，不列入「還沒確認」

// 折線圖（純 SVG，不用外部函式庫）。pts=[{k:'115-10',v:數值,e:推估值}]，curKey 那一點用橘色標出來。

    const cum=[0], cum2=[0], acc=gs.map(()=>0);   // cum2＝只算主要、不加平分
    for(let d=1,a=0;d<=ds.D;d++){ a+=ds.sum[d]; cum2[d]=a; let s=0; gs.forEach((x,i)=>{ acc[i]+=x.sum[d]; s+=Math.floor(acc[i]/x.N); }); cum[d]=a+s; }
    return {ds,cum,cum2,legend:['我的點數（主要＋平分）','只算主要（不含平分）']}; },
};
// 各指標「某個月 1 日到第 d 天」的累計（給「較上月同期」用）。沒列在這裡的指標（例如每小時）本來就是比率，照舊比整個月
function mtdSum(key,d,val){ const live=ratesFor(key), ds=dailySums(key,(r,c)=>val(r,c,live)); let t=0; for(let i=1;i<=Math.min(d,ds.D);i++) t+=ds.sum[i]; return t; }
const MTD={
  sales:(k,d)=>mtdSum(k,d,(r,c,live)=>rowVal(r,c,live,'price')),
  units:(k,d)=>mtdSum(k,d,r=>sumVals(r.it)),
  cost: (k,d)=>mtdSum(k,d,(r,c,live)=>rowVal(r,c,live,'cost')),
  rebate:(k,d)=>mtdSum(k,d,(r,c,live)=>rowVal(r,c,live,'cost')-['doc','promo','pool','fund'].reduce((t,f)=>t+rowVal(r,c,live,f),0)),
  myamt:(k,d)=>{ const x=CUM.myamt(k); return x.cum[Math.min(d,x.ds.D)]; },
  myunits:(k,d)=>{ const n=viewInfo?viewInfo.name:'', f=isDocView()?'doc':'np'; return mtdSum(k,d,r=>r[f]===n?sumVals(r.it):0); },
  mysales:(k,d)=>{ const n=viewInfo?viewInfo.name:''; return mtdSum(k,d,(r,c,live)=>r.doc===n?rowVal(r,c,live,'price'):0); },
};
// 這個月還沒過完時的比較基準＝上個月同期。回傳 {pv,est}；不是當月、或這個指標不能逐日累計時回 null（照舊比整個上個月）
function prevSamePeriod(m,key){
  if(key!==todayKey()||!MTD[m]) return null;
  const pk=shiftKey(key,-1), T=TREND[m], D=new Date().getDate();
  if(state.data.months[pk]) return {pv:MTD[m](pk,D),est:0};
  if(T.hist&&!VIEW&&histOf(pk)){ const [py,pm]=pk.split('-').map(Number), pdim=new Date(py+1911,pm,0).getDate();
    return {pv:T.hist(pk)*Math.min(D,pdim)/pdim,est:1}; }   // 上個月只有整月的數字：按天數比例折算
  return {pv:null,est:0};
}
// 預估全月＝目前累計 ÷ 已過天數 × 這個月的天數，再和整個上個月比。只在這個月還沒過完、而且已經過了 3 天以上時才給（太早估不準）
function projHtml(m,key){
  if(key!==todayKey()) return '';
  const [y,mo]=key.split('-').map(Number), dim=new Date(y+1911,mo,0).getDate(), D=new Date().getDate();
  if(D>=dim||D<3) return '';
  const T=TREND[m], proj=T.get(key)*dim/D, pk=shiftKey(key,-1);
  const pv=state.data.months[pk]?T.get(pk):(T.hist&&!VIEW&&histOf(pk)?T.hist(pk):null), d=pv==null?null:pctVs(proj,pv);
  const shown=proj>=10000?Math.round(proj/1000)*1000:Math.round(proj);   // 估出來的數字不寫到個位數，免得看起來很準
  return `預估全月約 ${fmt(shown)}${d==null?'':'<br>較上月 '+pctHtml(d)}`;
}
function cumHtml(m){
  if(!CUM[m]||!cur||!state.data.months[cur]) return '';
  const {ds,cum,cum2,legend,daily}=CUM[m](cur), pts=[]; for(let d=1;d<=ds.D;d++) pts.push(cum2?{k:d,v:cum[d],v2:cum2[d]}:{k:d,v:cum[d]});
  const notes=[];   // 只在資料有狀況時才出現
  if(ds.odd) notes.push(`有 ${ds.odd} 筆沒有日期（或日期不在這個月），算在 1 日`); if(ds.late) notes.push(`有 ${ds.late} 筆的日期在今天之後，沒有畫進來`);
  return `<div class="cumh">${keyLabel(cur)}・逐日累進<small>${ds.mm}月1日～${ds.D}日</small></div>${lineSvg(pts,ds.isNow?ds.D:-1,ds.mm)}`+
    (cum2?`<div class="lg2"><span><i></i>${legend[0]}</span><span><i class="d"></i>${legend[1]}</span></div>`:'')+
    (notes.length?`<div class="sub2" style="margin-top:0">${notes.join('；')}。</div>`:'')+
    (daily?(()=>{ const dp=[]; let mx=1;   // 每天各增加多少；最高的那一天標出數字
      for(let d=1;d<=ds.D;d++){ dp.push({k:d,v:ds.sum[d]}); if(ds.sum[d]>ds.sum[mx]) mx=d; }
      if(ds.sum[mx]>0) dp[mx-1].lab=1;
      return `<div class="cumh">${keyLabel(cur)}・逐日<small>每天各增加多少（不累計）</small></div>${lineSvg(dp,ds.isNow?ds.D:-1,ds.mm)}`; })():'')+
    `<div class="cumh">逐月趨勢</div>`;
}

  if(!VIEW) ensureBrandTrend(); else if(!isDocView()) ensureMyBrandTrend();

      const gx=m==='vendor'&&!VIEW&&brandList().length?brandParts(bvOf(p.k)):null;   // 總點數：每個月的值下面列各廠牌各多少

    `</tbody></table></div>`+
    (anyH?`<div class="sub2">${T.est?'標「推估」的月份沒有逐筆紀錄：是拿當時報表上的原始總點數，用各品項的原始點數反推件數，再換算出來的，只能當參考（圖上是空心點、虛線）。':'標「報表」的月份是試算表開始記錄以前的，用的是當時報表上的數字。'}</div>`:

}

// ---------- 確認註記 ----------
// 第一次註記時把當下的設定存成這個月的快照
function ensureMonth(key){
  const pm=state.pay[key]||(state.pay[key]={}); pm.paid=pm.paid||{};
  if(!pm.cfg){ pm.cfg=clone(cfgFor(key)); pm.cfgT=Date.now(); }
  else{   // 加科部之前留下的快照：把現行的科部點數寫進去固定下來
    const live=ratesFor(key); let ch=false;
    Object.keys(pm.cfg.products||{}).forEach(pid=>{ const r=pm.cfg.products[pid]; if(!r) return;
      ['fund','price','cost'].forEach(f=>{ if(r[f]==null){ r[f]=(live[pid]||ZERO)[f]; ch=true; } }); });
    if(ch) pm.cfgT=Date.now();
  }
  return pm;
}
function findPerson(pk){ return people(calcMonth(cur)).find(p=>p.pk===pk); }
function doPay(pk){
  const p=findPerson(pk); if(!p||!p.payable) return;
  ensureMonth(cur).paid[pk]={amt:p.amt,at:(p.rec&&p.rec.at)||today(),t:Date.now()};
  saveState(); renderAll();
}
function doUnpay(pk){
  const p=findPerson(pk); if(!p||!p.rec) return;
  if(!confirm(`取消「${p.name}」${keyLabel(cur)}的${payWord(p).ok}註記（${fmt(p.rec.amt)} 點）？`)) return;
  const pm=state.pay[cur]; pm.paid[pk]={del:1,t:Date.now()};
  if(!Object.keys(paidOf(cur)).length){ pm.cfg=null; pm.cfgT=Date.now(); }   // 整個月都沒有確認紀錄了＝回到跟著現行設定
  saveState(); renderAll();
}
function doPayAll(role){
  const list=people(calcMonth(cur)).filter(p=>p.role===role&&p.payable&&!p.rec&&p.amt>0);
  if(!list.length) return;
  const who=role==='d'?'醫師':'專師';
  if(!confirm(`把 ${keyLabel(cur)} 還沒確認的 ${list.length} 位${who}（共 ${fmt(list.reduce((s,p)=>s+p.amt,0))} 點）全部標記為已確認？`)) return;
  const pm=ensureMonth(cur), at=today(), t=Date.now();
  list.forEach(p=>{ pm.paid[p.pk]={amt:p.amt,at,t}; });
  saveState(); renderAll();
}

// ---------- 單筆通知 ----------
// 試算表的一筆（一列）品項點數達到門檻時，祝賀那一筆的主要專師與醫師：「賀 專師X醫師，水性×1、除疤×1」（使用者指定的寫法；少一個就只寫有的那位）。
// 背後沒有伺服器在發送：是每台裝置在 App 開著（或再打開）、讀到試算表時自己發現新的紀錄——
// 畫面最上面出現一條祝賀；這台裝置允許跳出通知的話，當天的新紀錄另外跳一則系統通知。App 完全關掉時不會響。
// 要不要發與門檻（cfg.big）由主任端設定、會同步，也帶進每個人的個人連結；各裝置可以自己關掉（LS_BIG 的 off）。
const LS_BIG='erCommission_big';
let bigNew=[];   // 這台裝置還沒按「知道了」的
function bigState(){ let o=null; try{ o=JSON.parse(localStorage.getItem(LS_BIG)||'null'); }catch(e){} o=o||{}; o.seen=o.seen||{}; o.pushed=o.pushed||{}; return o; }
function bigSave(o){ try{ localStorage.setItem(LS_BIG,JSON.stringify(o)); }catch(e){} }
// 一筆的品項點數。個人頁沒有完整的每件點數，用主任放進來的品項點數（cfg.big.p）算
function bigVal(r,key){
  if(VIEW){ const pr=(state.cfg.big||{}).p||{}; return Object.keys(r.it).reduce((t,pid)=>t+r.it[pid]*(Number(pr[pid])||0),0); }
  const cfg=monthCfg(key), live=ratesFor(key); return Object.keys(r.it).reduce((t,pid)=>t+r.it[pid]*rateOf(cfg,pid,live).price,0);
}
// 這個月與上個月裡達到門檻的紀錄（id＝月份|序，同一筆之後再改內容不會重複通知）
function bigItems(){
  const b=state.cfg.big||{}, out=[], tk=todayKey(); if(!b.on||!(b.min>0)) return out;
  [shiftKey(tk,-1),tk].forEach(k=>{ const md=state.data.months[k]; if(!md) return;
    md.rows.forEach((r,i)=>{ const v=bigVal(r,k); if(v>=b.min) out.push({id:k+'|'+(r.n!==''&&r.n!=null?r.n:'i'+i),k,r,v}); }); });
  return out;
}
const bigText=x=>`賀 ${[x.r.np,x.r.doc].filter(Boolean).join('X')||'（未填姓名）'}，${Object.keys(x.r.it).map(pid=>`${prodName(pid)}×${x.r.it[pid]}`).join('、')}`;
function bigNotify(x){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted') return;
    const opt={body:bigText(x),tag:'big-'+x.id,icon:'icon-192.png',badge:'icon-192.png'}, sw=navigator.serviceWorker;
    if(sw&&sw.getRegistration) sw.getRegistration().then(reg=>{ if(reg&&reg.showNotification) reg.showNotification('急診點數',opt); else new Notification('急診點數',opt); }).catch(()=>{});
    else new Notification('急診點數',opt);
  }catch(e){}
}
function bigCheck(){
  const b=state.cfg.big||{}; bigNew=[];
  if(!b.on||!(b.min>0)||!Object.keys(state.data.months).length) return;
  const items=bigItems(), st=bigState(), d=new Date(), md=`${d.getMonth()+1}/${d.getDate()}`; let ch=false;
  // 這台裝置第一次用、門檻剛改過、或自己關掉通知：現有的都當作看過，不補發（免得一次跳出一大串）
  if(!st.init||st.min!==b.min||st.off){
    items.forEach(x=>{ if(!st.seen[x.id]||!st.pushed[x.id]){ st.seen[x.id]=1; st.pushed[x.id]=1; ch=true; } });
    if(!st.init||st.min!==b.min){ st.init=1; st.min=b.min; ch=true; }
    if(ch) bigSave(st); return;
  }
  items.forEach(x=>{ if(st.seen[x.id]) return; bigNew.push(x);
    if(!st.pushed[x.id]){ st.pushed[x.id]=1; ch=true; if(x.r.d===md) bigNotify(x); } });   // 跳通知只給今天的；較早的只在畫面上列出來
  const keep=new Set(items.map(x=>x.id)), old=shiftKey(todayKey(),-1);   // 只留這個月和上個月的紀錄
  ['seen','pushed'].forEach(f=>Object.keys(st[f]).forEach(id=>{ if(!keep.has(id)&&id.split('|')[0]<old){ delete st[f][id]; ch=true; } }));

async function deriveSync(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode('er-commission-sync-v1'),iterations:250000},base,384));
  return {key:b64(bits.subarray(0,32)),id:[...bits.subarray(32,48)].map(b=>b.toString(16).padStart(2,'0')).join('')};
}

async function seal(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(key),te.encode(JSON.stringify(obj)));
  return {v:1,t:Date.now(),iv:b64(iv),data:b64(new Uint8Array(ct))};
}
async function unseal(blob,key){

// 資料庫規則要求登入：用 REST 匿名登入拿 idToken（使用者無感）；之後用 refresh token 續用同一個匿名身分
async function idToken(force){
  if(!force&&_tok&&Date.now()<_tokExp) return _tok;
  const keep=d=>{ _tok=d.idToken||d.id_token; _tokExp=Date.now()+(Number(d.expiresIn||d.expires_in||3600)-60)*1000;
    const rt=d.refreshToken||d.refresh_token; if(rt){ try{ localStorage.setItem(LS_RT,rt); }catch(e){} } return _tok; };
  let rt=null; try{ rt=localStorage.getItem(LS_RT); }catch(e){}
  if(rt){
    const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
    if(r.ok) return keep(await r.json());
  }
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok) throw new Error('雲端登入失敗（HTTP '+r.status+'）');
  return keep(await r.json());
}
async function cloudReq(method,body,id){

      {method,cache:'no-store',body:body==null?undefined:JSON.stringify(body)});
    if(r.ok) return r.json();
    const msg=await r.text().catch(()=>'');
    if((r.status===401||r.status===403)&&i===0&&/expired|invalid/i.test(msg)) continue;   // token 過期：重拿一次
    if(r.status===401||r.status===403) throw Object.assign(new Error('雲端規則尚未開放這個 App'),{kind:'denied'});

// 這一天每個人（班表上的代號）各上幾小時。cfg＝切割點設定（逐月的 monthSplit 以 '年-月(0 起算)' 為鍵），hol＝假日
function schedDayHours(dateStr,ds,cfg,hol){
  const out={}, [y,m,d]=dateStr.split('-').map(Number), cl=v=>Math.min(20,Math.max(16,v||20));
  const mc=cfg.monthSplit&&cfg.monthSplit[`${y}-${m-1}`];
  const sc=mc?{d:cl(mc.d||20),h:cl(mc.h||17),bal:!!mc.bal}:{d:cl(cfg.defaultSplit||20),h:cl(cfg.holidaySplit||17),bal:!!cfg.splitBalance};
  const dow=new Date(y,m-1,d).getDay(), sp=ds.split||(sc.bal?18:((hol.has(dateStr)||dow===0||dow===6)?sc.h:sc.d));
  const span=t=>{ const mm=String(t||'').match(/^(\d{1,2})-(\d{1,2})$/); if(!mm) return 0; let a=+mm[1], b=+mm[2]; if(b<=a) b+=24; return b-a; };
  const slotH={'主白':12,'早班':sp-8,'小夜':26-sp,'大夜':12};
  Object.keys(slotH).forEach(sl=>{ const id=ds[sl]; if(!id) return; const ct=ds.customTimes&&ds.customTimes[sl]; out[id]=(out[id]||0)+(ct?span(ct):slotH[sl]); });
  Object.values(ds.extras||{}).forEach(ex=>{ if(ex&&ex.docId&&!/^(yangtian|icu|ward)$/.test(ex.kind||'')) out[ex.docId]=(out[ex.docId]||0)+span(ex.timeRange); });
  return out;
}

    await idToken();   // 先把登入拿好，下面幾個同時發的請求才不會各自去登入、互相把對方的憑證換掉
    const [days,docs,hol,ms,dsp,hsp,bal]=await Promise.all([schedGet('schedule',q),schedGet('doctors'),schedGet('holidays'),

    ks.forEach(k=>{ m[k]={}; });

  state.led=state.led||{};

async function newView(name){
  if(!sheetUrl()){ alert('要先設定試算表網址，才能建立查看連結。'); return; }
  if(sync&&!_syncOk){ alert('還在和雲端同步，請稍等幾秒再試一次。'); return; }
  const old=state.cfg.views[name], olds=((old&&old.old)||[]).slice();
  if(old&&old.tok&&!old.del){
    if(!confirm(`替「${viewWho(name).name}」換一條新的連結？\n舊的連結會立刻失效，要把新連結重新傳給他。`)) return;
    try{ await cloudReq('DELETE',null,parseViewTok(old.tok).id); _delDone[old.tok]=1; }
    catch(e){ alert('連不上雲端，舊連結沒辦法停用，請稍後再試。'); return; }
  }
  if(old&&old.tok&&!olds.includes(old.tok)) olds.push(old.tok);   // 停用過或換掉的代碼都留著，之後每次開啟再刪一次
  const tok=b64(crypto.getRandomValues(new Uint8Array(48))).replace(/\+/g,'-').replace(/\//g,'_');
  state.cfg.views[name]=olds.length?{tok,t:Date.now(),old:olds}:{tok,t:Date.now()};
  saveState(); renderCfg(); await publishViews();
  if(pubSt[name]==='err') alert('連結建立了，但目前連不上雲端、內容還沒放上去。連上網路後會自動補上，到時候連結才打得開。');
}

  const pool=(n,inPool)=>{ if(doc) return []; const a=inPool?[b.name]:[]; while(a.length<(Number(n)||0)) a.push('\u0001'+a.length); return a; };

  Object.keys(b.months||{}).forEach(k=>{ const m=b.months[k], pm=state.pay[k]={paid:{}};

  el.innerHTML=`<details class="card sec" data-sec="me-rows"${isOpen('me-rows')?' open':''}><summary><span>${doc?'這個月的明細':'這個月的主要明細'}</span><span class="sum-amt">${rows.length} 筆</span></summary>
      <div class="tw"><table><thead><tr><th>序</th><th class="l">日期</th><th class="l">品項 × 數量</th><th class="l">${doc?'主要':'醫師'}</th><th>${doc?'點數':'主要點數'}</th></tr></thead><tbody>`+
      (rows.map(r=>`<tr><td class="n">${esc(r.n)}</td><td class="l">${esc(r.d)}</td><td class="l" style="white-space:normal">${Object.keys(r.it).map(pid=>`${esc(prodName(pid))} × ${r.it[pid]}`).join('、')}</td><td class="l">${esc(doc?r.np:r.doc)}</td><td class="n">${fmt(each(r))}</td></tr>`).join('')||
       `<tr><td class="l mut" colspan="5">${doc?'這個月還沒有你的紀錄':'這個月還沒有你為主要的紀錄'}</td></tr>`)+`</tbody></table></div></details>
    <details class="card sec" data-sec="me-all"${isOpen('me-all')?' open':''}><summary><span>各月合計</span><span class="sum-amt">${all.length} 個月</span></summary>
      <div class="tw"><table><thead><tr><th class="l">月份</th><th>件數</th>${doc?'<th>點數</th><th>品項總點數</th><th>上班時數</th><th>每小時</th>':'<th>主要</th><th>平分</th><th>合計</th><th class="l">確認</th>'}</tr></thead><tbody>`+
      all.map(({k,p})=>{ const hh=doc?docHours(name,k):null, rt=perHour(p.sales||0,hh);
        return `<tr><td class="l">${keyLabel(k)}</td><td class="n">${sumVals(p.it)}</td>`+(doc
          ?`<td class="amt">${fmt(p.amt)}</td><td class="n">${noP?'—':fmt(p.sales||0)}</td><td class="n">${hh==null?'—':hh}</td><td class="n">${noP||rt==null?'—':fmt(rt)}</td></tr>`
          :`<td class="n">${fmt(p.promo)}</td><td class="n">${fmt(p.share)}</td><td class="amt">${fmt(p.amt)}`+
           (bl.length&&p.amt?`<div class="estit gsub">${bl.filter(b=>(p.bb||{})[b]).map(b=>`${esc(bName(b))} ${fmt(p.bb[b])}`).join('<br>')}</div>`:'')+`</td>`+
           `<td class="l">${p.rec?`<span class="tag ok">✓ ${shortDate(p.rec.at)}</span>`:p.amt?'<span class="tag no">未確認</span>':'—'}</td></tr>`); }).join('')+`</tbody></table></div></details>
    ${doc?`<div class="card"><h2>累積點數</h2>${cumTiles(cum)}
      <div class="tw" style="margin-top:8px"><table><thead><tr><th class="l">確認日期</th><th>點數</th><th class="l">備註</th></tr></thead><tbody>`+
      (cum.recs.slice().reverse().map(r=>`<tr><td class="l">${esc(r.at)}</td><td class="n">${fmt(r.amt)}</td><td class="l" style="white-space:normal">${esc(r.note)}</td></tr>`).join('')||
       '<tr><td class="l mut" colspan="3">還沒有確認紀錄</td></tr>')+`</tbody></table></div></div>`
    :`<div class="card"><div class="row" style="margin:0"><b>確認狀態</b>${paidTxt}</div></div>`}
    ${bigMeHtml()}
    ${installHtml()}
    <div style="text-align:center;margin-top:8px"><button class="btn mini ghost" data-act="me-forget">在這台裝置移除這個連結</button></div>`;
}

// ---------- 事件 ----------
function act(a,t,ev){
  const k=t.dataset.k;
  if(VIEW&&!/^(refresh|month|mstep|mpick|myear|today|trend|close|me-forget|me-install|me-paste|big-ok|big-local|big-perm)$/.test(a)) return;   // 個人查看模式只能看
  if(a==='refresh'){ if(VIEW) loadView(); refresh(false); }
  else if(a==='me-install'){ if(_installEvt){ const e=_installEvt; _installEvt=null; e.prompt(); } }
  else if(a==='me-paste'){
    const m=String(($('me-link')||{}).value||'').match(/me=([A-Za-z0-9_-]{64})/);
    if(!m||!parseViewTok(m[1])){ alert('這看起來不是個人查看連結。\n請把主任傳給你的整條連結完整貼上（後面有一長串英數字）。'); return; }
    if(VIEW_ONLY||location.protocol==='file:'){ try{ if(VIEW_ONLY) localStorage.setItem(LS_ME,m[1]); }catch(e){} location.hash='me='+m[1]; location.reload(); }
    else location.href='me.html#me='+m[1];   // 個人查看一律走專用入口
  }
  else if(a==='me-open') location.href='me.html';
  else if(a==='me-forget'){
    if(!confirm('在這台裝置移除這個連結？\n之後要再看，需要重新打開主任給的連結。')) return;
    try{ localStorage.removeItem(LS_ME); }catch(e){} location.href=location.pathname;
  }
  else if(a==='big-ok') bigAck();
  else if(a==='inv-ev') showInvEv(k);
  else if(a==='lock'||a==='unlock'){ if(!lockBusy) setLock(k,a==='lock'); }
  else if(a==='inv-ok'){ const s=invSummary(); if(!s||!s.lastCnt) return;
    const ok=invAcked().concat(invEvKey(s.lastCnt)).slice(-50); try{ localStorage.setItem(LS_INV_OK,JSON.stringify(ok)); }catch(e){} renderAlerts(); }
  else if(a==='big-perm'){ try{ const q=Notification.requestPermission(()=>renderAll()); if(q&&q.then) q.then(()=>renderAll()); }catch(e){} }
  else if(a==='big-local'){ const st=bigState(); st.off=t.checked?0:1; bigSave(st); renderAll(); }
  else if(a==='big-on'){ state.cfg.big=Object.assign({},state.cfg.big,{on:!!t.checked,t:Date.now()}); saveState(); renderAll(); }
  else if(a==='big-save'){ const v=Math.max(0,Math.round(Number(($('big-min')||{}).value)||0));
    if(!v){ alert('請輸入門檻點數。'); return; }
    state.cfg.big=Object.assign({},state.cfg.big,{min:v,t:Date.now()}); saveState(); document.activeElement&&document.activeElement.blur(); renderAll(); }
  else if(a==='led') showLed(k);
  else if(a==='led-add') ledAdd(k);
  else if(a==='led-del') ledDel(k,t.dataset.id);
  else if(a==='view-new') newView(t.dataset.n);
  else if(a==='view-del'){
    const n=t.dataset.n, v=state.cfg.views[n]; if(!v||v.del) return;
    if(!confirm(`停用「${viewWho(n).name}」的查看連結？\n停用後那條連結立刻失效，之後可以再建立新的。`)) return;
    state.cfg.views[n]=Object.assign({del:1,t:Date.now(),tok:v.tok},v.old?{old:v.old}:{}); saveState(); renderCfg(); publishViews();
  }
  else if(a==='view-copy'){
    const v=state.cfg.views[t.dataset.n]; if(!v||!v.tok) return;
    const url=viewUrl(v.tok), done=()=>{ const o=t.textContent; t.textContent='✓ 已複製'; setTimeout(()=>{ t.textContent=o; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt('請複製這條連結：',url));
    else prompt('請複製這條連結：',url);
  }
  else if(a==='month') switchMonth(k);
  else if(a==='mstep') switchMonth(_mbKeys[_mbKeys.indexOf(cur)+Number(t.dataset.d)]);
  else if(a==='mpick'){ pickOpen=!pickOpen; pickYear=null; renderAll(); }
  else if(a==='myear'){ const ys=[...new Set(_mbKeys.map(x=>+x.split('-')[0]))], y=ys[ys.indexOf(pickYear)+Number(t.dataset.d)]; if(y){ pickYear=y; renderAll(); } }
  else if(a==='pay'||a==='repay') doPay(k);
  else if(a==='unpay') doUnpay(k);
  else if(a==='payall') doPayAll(t.dataset.role);
  else if(a==='date'){ const r=state.pay[cur]&&state.pay[cur].paid[k]; if(r&&!r.del&&t.value){ r.at=t.value; r.t=Date.now(); saveState(); renderYear(); } }
  else if(a==='resnap'){
    if(!confirm(`${keyLabel(cur)}改用現在的設定重算？\n已經確認的點數不會變，若新算法的點數不同，會在該列提醒差額。`)) return;
    state.pay[cur].cfg=clone(cfgFor(cur)); state.pay[cur].cfgT=Date.now(); saveState(); renderAll();
  }
  else if(a==='detail') showDetail(k);
  else if(a==='today') showToday();
  else if(a==='trend') showTrend(t.dataset.m);
  else if(a==='close') $('mask').classList.remove('on');
  else if(a==='year'){ yearSel=t.value; renderYear(); }
  else if(a==='rate'){
    // 只記進草稿，按「儲存」才生效；改回原本的數字＝沒有修改
    const pid=t.dataset.pid, f=t.dataset.f, d=rateDraft[pid]||(rateDraft[pid]={});
    if(t.value!==''&&Number(t.value)===monthRates(cur)[pid][f]) delete d[f]; else d[f]=t.value;
    if(!Object.keys(d).length) delete rateDraft[pid];
    t.classList.toggle('chg',!!(rateDraft[pid]&&f in rateDraft[pid]));
    refreshCfgRow(pid); renderRateSave();
  }
  else if(a==='brand'){
    const pid=t.dataset.pid;
    if(t.value==='__new'){ brandNew[pid]=1; renderRates();
      const inp=[...document.querySelectorAll('#rates-view .brin')].find(x=>x.dataset.pid===pid); if(inp) inp.focus(); return; }
    setBrand(pid,t.value);
  }
  else if(a==='brand-add'){
    const inp=t.parentNode.querySelector('.brin'), v=normName(inp&&inp.value);
    if(!v){ alert('請輸入廠牌名稱。'); return; }
    setBrand(t.dataset.pid,v);
  }
  else if(a==='brand-cancel'){ delete brandNew[t.dataset.pid]; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); renderRates(); }
  else if(a==='rate-save'){
    if(!draftDirty()||!cur) return;
    if(!confirm(`儲存 ${keyLabel(cur)}的每件點數？\n\n從 ${keyLabel(cur)}起適用，之後沒有另外修改的月份也跟著沿用；之前的月份不受影響。`)) return;
    // 存成「這個月的一組」：從這個月起適用，之後沒另外改的月份沿用它；之前的月份不動
    const full=draftRates(), now=Date.now(), pm=state.pay[cur];
    state.cfg.rateSets[cur]={r:clone(full),t:now};
    if(pm&&pm.cfg){ pm.cfg.products=clone(full); pm.cfgT=now; }   // 這個月已有確認紀錄（點數固定在快照裡）→ 快照一起改，已確認的人會顯示差額
    rateDraft={}; saveState();
    if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
    renderAll();
  }
  else if(a==='rate-inherit'){
    const rs=state.cfg.rateSets; if(!cur||!rs[cur]||rs[cur].del) return;
    if(!confirm(`${keyLabel(cur)}不要自己的設定，改回沿用前面的？\n（之後沒有另外修改的月份也會跟著變）`)) return;
    const now=Date.now(), pm=state.pay[cur];
    rs[cur]={del:1,t:now}; rateDraft={};
    if(pm&&pm.cfg){ pm.cfg.products=clone(ratesFor(cur)); pm.cfgT=now; }
    saveState(); renderAll();
  }
  else if(a==='rate-cancel'){
    rateDraft={}; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); renderAll();
  }
  else if(a==='sharer-add'){
    const n=normName($('sharer-new').value); if(!n) return;
    const sh=liveSharers(); if(sh.includes(n)){ alert('名單上已經有「'+n+'」'); return; }
    sh.push(n); state.cfg.sharers=sh; state.cfg.tS=Date.now(); saveState(); $('sharer-new').value=''; document.activeElement.blur(); renderAll();
  }
  else if(a==='sharer-del'){
    const n=t.dataset.n;
    if(!confirm(`把「${n}」移出平分名單？\n（只影響還沒確認過的月份；他的主要點數照算）`)) return;
    state.cfg.sharers=liveSharers().filter(x=>x!==n); state.cfg.tS=Date.now(); saveState(); renderAll();
  }
  else if(a==='sharer-reset'){ state.cfg.sharers=null; state.cfg.tS=Date.now(); saveState(); renderAll(); }
  else if(/^bsh-/.test(a)){   // 某廠牌品項自己的平分名單
    const b=t.dataset.b, L=(((state.cfg.bShare&&state.cfg.bShare.m)||{})[b]||[]).slice();
    const put=list=>{ const m=Object.assign({},(state.cfg.bShare&&state.cfg.bShare.m)||{}); if(list&&list.length) m[b]=list; else delete m[b];
      state.cfg.bShare={m,t:Date.now()}; saveState(); renderAll(); };
    if(a==='bsh-new'){ if(confirm(`「${b}」的品項另外設一份平分名單？\n先照目前的平分名單（${liveSharers().length} 位）建立，之後可以加減人。只影響還沒確認過的月份。`)) put(liveSharers()); }
    else if(a==='bsh-add'){ const inp=$('bsh-new-'+t.dataset.i), n=normName(inp&&inp.value); if(!n) return;
      if(L.includes(n)){ alert('名單上已經有「'+n+'」'); return; }
      if(confirm(`把「${n}」加入「${b}」品項的平分名單？\n（只影響還沒確認過的月份）`)) put(L.concat(n)); }
    else if(a==='bsh-del'){ const n=t.dataset.n;
      if(confirm(`把「${n}」移出「${b}」品項的平分名單？\n（只影響還沒確認過的月份；他的主要點數照算）`)) put(L.filter(x=>x!==n)); }
    else if(a==='bsh-reset'){ if(confirm(`「${b}」的品項改回用上面的平分名單？\n（只影響還沒確認過的月份）`)) put(null); }
  }
  else if(a==='url-save'){
    const v=$('cfg-url').value.trim();
    if(v&&!sheetId(v)){ alert('看起來不是 Google 試算表網址（應該長得像 https://docs.google.com/spreadsheets/d/…）'); return; }
    if(v&&v!==window.COMMISSION_SHEET_URL) state.cfg.url=v; else delete state.cfg.url;
    state.cfg.tU=Date.now(); saveState(); document.activeElement.blur(); refresh(false);
  }
  else if(a==='upload'){
    const f=t.files&&t.files[0]; t.value=''; if(!f) return;
    loadXLSX().then(()=>f.arrayBuffer()).then(buf=>{
      const acc=parseWorkbook(XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true}));
      if(!Object.keys(acc.months).length){ alert('這個檔案裡找不到使用紀錄（需要有「專師」欄與品項數量欄的月份分頁）。'); return; }
      mergeResult(acc,'upload'); fail=null; renderAll();
    }).catch(e=>alert('讀取失敗：'+(e&&e.message||e)));
  }
  else if(a==='sync-on'){ const inp=$(t.dataset.src); if(inp) enableSync(inp.value); }
  else if(a==='sync-now') syncNow();
  else if(a==='sync-chpw'){ const inp=$(t.dataset.src); if(inp) changeSyncPw(inp.value).then(()=>{ if(sync&&sync.strong) inp.value=''; }); }
  else if(a==='notice-ok'){ _notice=null; try{ localStorage.removeItem(LS_NOTICE); }catch(e){} renderAlerts(); }
  else if(a==='sync-off'){
    if(!confirm('在這台裝置關閉雲端同步？\n\n這台裝置上的資料會留著，雲端上的也不會被刪除；之後要再同步，重新輸入同一組密碼即可。')) return;
    sync=null; try{ localStorage.removeItem(LS_SYNC); }catch(e){} setSync('off');
  }
  else if(a==='goto-sync'){ $('card-cfg').open=true; renderCfg(); const h=$('sync-h'); if(h) h.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(a==='force-update') forceUpdate();
  else if(a==='backup-export') download(`急診點數備份_${today().replace(/-/g,'')}.json`,JSON.stringify(state),'application/json');
  else if(a==='backup-import'){
    const f=t.files&&t.files[0]; t.value=''; if(!f) return;
    f.text().then(txt=>{
      let s; try{ s=JSON.parse(txt); }catch(e){ alert('這不是備份檔（讀不出 JSON）。'); return; }
      if(!s||typeof s!=='object'||!s.pay||!s.cfg){ alert('這不是本系統的備份檔。'); return; }
      const live=k=>Object.values((s.pay[k]&&s.pay[k].paid)||{}).filter(r=>r&&!r.del).length;
      const n=Object.keys(s.pay).reduce((a,k)=>a+live(k),0);
      if(!confirm(`匯入這份備份（${Object.keys(s.pay).filter(live).length} 個月、${n} 筆確認註記）？\n\n目前的設定與確認註記會被它整個取代${sync?'，開著雲端同步的其他裝置也會跟著換成這份':''}。\n匯入前會先下載一份目前的備份。`)) return;
      download(`急診點數備份_匯入前_${today().replace(/-/g,'')}.json`,JSON.stringify(state),'application/json');
      const old=state, s2=normState(s), c=s2.cfg, now=Date.now();
      // 備份裡的內容一律當成「現在改的」；目前有、備份裡沒有的逐筆留取消標記。
      // 開著雲端同步時，雲端（別台裝置）上較新的內容才不會又併回來
      c.tR=c.tS=now;
      const restore=(curO,bak)=>{ Object.keys(bak).forEach(k=>{ if(bak[k]) bak[k].t=now; }); Object.keys(curO||{}).forEach(k=>{ if(!bak[k]) bak[k]={del:1,t:now}; }); };
      restore(old.cfg.rateSets,c.rateSets); restore(old.cfg.hist,c.hist); restore(old.led,s2.led);
      c.brand={m:Object.assign({},(c.brand&&c.brand.m)||{}),t:now};
      c.big=Object.assign({on:true,min:5000},c.big,{t:now});
      // 個人查看連結與試算表網址照目前的（換回舊的會讓之後才建立的連結失效、或讀回舊的試算表）
      c.views=old.cfg.views; ['url','tU','urlV'].forEach(f=>{ if(old.cfg[f]!=null) c[f]=old.cfg[f]; else delete c[f]; });
      [...new Set([...Object.keys(old.pay),...Object.keys(s2.pay)])].forEach(k=>{
        const bm=s2.pay[k]||(s2.pay[k]={paid:{}}), om=old.pay[k]||{paid:{}};
        bm.cfg=bm.cfg||null; bm.cfgT=now;
        Object.keys(bm.paid).forEach(pk=>{ bm.paid[pk].t=now; });
        Object.keys(om.paid||{}).forEach(pk=>{ if(!bm.paid[pk]) bm.paid[pk]={del:1,t:now}; });
      });
      state=s2; saveState(); cur=null; renderAll(); refresh(true);
    });
  }
}
document.addEventListener('click',e=>{
  if(e.target===$('mask')){ $('mask').classList.remove('on'); return; }
  if(pickOpen&&!e.target.closest('#mpick')&&!e.target.closest('#monthbar')){ pickOpen=false; $('mpick').classList.remove('on'); }   // 點月份選單外面＝收起來
  const t=e.target.closest('[data-act]'); if(!t||t.tagName==='INPUT'||t.tagName==='SELECT') return;
  act(t.dataset.act,t,'click');
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.act&&(t.tagName==='INPUT'||t.tagName==='SELECT')) act(t.dataset.act,t,'change'); });
// 點數表邊打邊更新右邊的試算欄與「還沒儲存」的提示（按儲存才真的生效）
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='rate') act('rate',t,'input'); });
// 卡片收合／展開（toggle 不會冒泡，要用 capture）→ 記在這台裝置
document.addEventListener('toggle',e=>{ const d=e.target;
  if(!d.dataset||!d.dataset.sec||isOpen(d.dataset.sec)===d.open) return;   // 和已記的狀態相同（含剛畫出來時瀏覽器自動發的事件）就不用記
  ui[d.dataset.sec]=d.open;
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') $('mask').classList.remove('on');
  if(e.key==='Enter'&&e.target.id==='sharer-new') act('sharer-add',e.target);
  if(e.key==='Enter'&&e.target.id==='cfg-url') act('url-save',e.target);
  if(e.key==='Enter'&&(e.target.id==='sync-pw'||e.target.id==='setup-pw')) enableSync(e.target.value);
  if(e.key==='Enter'&&e.target.id==='me-link') act('me-paste',e.target);
  if(e.key==='Enter'&&(e.target.id==='sync-newpw'||e.target.id==='top-newpw')) changeSyncPw(e.target.value);
});
// 點數表有還沒儲存的修改時，關掉或重新整理前先提醒
window.addEventListener('beforeunload',e=>{ if(!VIEW&&draftDirty()){ e.preventDefault(); e.returnValue=''; } });
// 已經開著 App 的分頁貼上個人連結只會換 # 後面、不會重新載入 → 手動重載才會進個人查看模式
window.addEventListener('hashchange',()=>{ const m=location.hash.match(/[#&]me=([A-Za-z0-9_-]{64})/); if(m&&(!VIEW||VIEW.tok!==m[1])) location.reload(); });
// 另一個分頁改了資料 → 這邊跟著更新
window.addEventListener('storage',e=>{
  if(VIEW) return;
  if(e.key===LS){ state=loadState(); renderAll(); }
  if(e.key===LS_SYNC){ try{ sync=JSON.parse(e.newValue||'null'); }catch(_){ sync=null; } setSync(sync?'idle':'off'); if(sync) syncNow(); }
});
// 網站上有新版就自動換上。手機上的 App 常常只是從背景叫回來、不會重新載入，會一直跑舊程式
// （主任那邊跑舊程式時，放到雲端給個人頁的內容也是舊格式）。回到畫面時、以及開著時每 10 分鐘，
// 比對網站上的版本號；不同、而且沒有正在輸入或開著視窗時，重新載入一次。
const SS_VER='erCommission_verTried';
let _verAt=0;
async function checkVersion(){
  if(location.protocol==='file:'||navigator.onLine===false||Date.now()-_verAt<3*60*1000) return;
  _verAt=Date.now();
  try{
    const r=await fetch('index.html',{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/const APP_VER='([^']+)'/);
    if(!m||m[1]===APP_VER) return;
    let tried=''; try{ tried=sessionStorage.getItem(SS_VER)||''; }catch(e){}
    if(tried.split('|')[0]===m[1]&&Date.now()-Number(tried.split('|')[1])<5*60*1000) return;   // 剛為這一版重載過、拿到的還是舊的（網站快取還沒換完）：先不要一直重載
    const ae=document.activeElement;
    if((ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))||draftDirty()||$('mask').classList.contains('on')){ _verAt=0; return; }   // 正在操作：下次再換
    try{ sessionStorage.setItem(SS_VER,m[1]+'|'+Date.now()); }catch(e){}
    location.reload();
  }catch(e){}
}
setInterval(()=>{ if(document.visibilityState==='visible') checkVersion(); },10*60*1000);
// 回到視窗超過 1 分鐘沒讀過就補讀；開著時每 5 分鐘讀一次
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  checkVersion();
  if(VIEW) loadView();
  if(Date.now()-(Date.parse(state.data.checked||0)||0)>60000) refresh(true);
  if(sync) syncNow();
});
setInterval(()=>{ if(sync&&document.visibilityState==='visible') syncNow(); },60*1000);
setInterval(()=>{ if(document.visibilityState==='visible') refresh(true); },5*60*1000);

if(VIEW){
  // 個人查看：先解開自己的資料（裡面有試算表網址），再讀試算表；之後每分鐘更新一次
  renderAll();
  loadView();
  setInterval(()=>{ if(document.visibilityState==='visible'){ loadView(); refresh(true); } },60*1000);
}else{
  if(!sync){ const a=applyDefaults(), b=applyHistory(), u=applyUrlVer(), l=applyLockVer(), p=applyPatches(); if(a||b||u||l||p) saveState(true); }
  renderAll();
  renderSync();
  refresh(true);
  if(sync) syncNow();
  setTimeout(publishViews,3000);   // 個人查看連結的內容每次開啟都重放一次（上次可能離線沒放成功）
}
</script>
</body>
