<title>急診點數</title>
<script>
// iPhone 的主畫面 App 有自己獨立的儲存空間，記不住個人查看連結；所以個人連結（#me=…）在 iPhone 上不掛 manifest，
// 「加入主畫面」存下來的就會是含 # 的完整網址（有 manifest 時 iOS 只存 start_url，圖示打開會變成空白的首次設定畫面）。
// 其他情況（主任自己用、Android）照常掛 manifest，才能安裝成獨立視窗的 App。
// window.VIEW_ONLY＝這一頁是從 me.html（個人查看專用入口）載進來的，用另一份 manifest（start_url 指回 me.html）。
(function(){
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var me=window.VIEW_ONLY||/[#&]me=[A-Za-z0-9_-]{64}/.test(location.hash);
  if(ios&&me) return;
  document.write('<link rel="manifest" href="'+(window.VIEW_ONLY?'manifest-me.json':'manifest.json')+'">');
})();
</script>
<meta name="theme-color" content="#1a4a7a">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急診點數">
<script>
// PWA：只在正式網站註冊 Service Worker（本機 file:// 與 localhost 測試不註冊，免得測到快取的舊版）
if('serviceWorker' in navigator && location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller; let reloading=false;
  // 新版 Service Worker 接手時自動重新整理（第一次安裝不用）
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!had||reloading) return; reloading=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}); });
}
</script>

  header.top{position:static}
  header.top h1 .sub{display:none}
  /* 手機：醫師／專師表改成一人一塊（姓名＋點數／件數／確認按鈕），不用左右捲 */

  table.ppl tr.bad{background:var(--badbg)}
  .pdate{width:120px}
}

<header class="top"><div class="wrap">

<!-- sheet-config.js（試算表網址＋預設點數）只存在本機、不上傳；網站版沒有這個檔，靠加密的雲端同步取得 -->
<script>
if(location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="sheet-config.js"><\/script>');
</script>
<script>
'use strict';
// ============================================================
// 急診點數：讀 Google 試算表逐筆紀錄 → 依每件點數算出每月每人的點數 → 人工註記已確認。
// 用詞規則：畫面、列印、匯出、註解都只講「點數」與「確認」，其他敏感字眼一律不用。
// 資料存在各裝置的 localStorage；要跨裝置就開「雲端同步」，上傳前先用同步密碼加密（見下方「雲端同步」）。
// 本檔會公開在網站上，所以不含任何姓名、點數、試算表網址：
//   ・姓名來自試算表；試算表網址與預設點數放本機的 sheet-config.js（不上傳）或由雲端同步取得。
// 只下載 序／日期／品項數量／專師／醫師 欄，其他欄位不下載、不儲存。
// ============================================================
const LS='erCommission_v1';
const APP_VER='2026.10.04t';
const PUBLIC_URL='https://leo005741010-byte.github.io/er-points/';   // 本機檔（file://）產生連結時用
// ---- 個人查看模式 ----
// 專師用的入口是 me.html（它載入這同一份程式、但先設 window.VIEW_ONLY）：只顯示本人的點數，
// 不載入也不寫入主任的資料，而且**永遠不會出現主任的同步密碼畫面**——沒帶到個人代碼時只會請他貼連結。
// 2026-10-04 出過事：個人連結原本掛在 index.html 上，iPhone 加到主畫面後代碼沒帶到，畫面退回主任的首次設定，
// 專師輸入了科內都知道的密碼就看到全部人的資料。所以 index.html 不再兼做個人查看，帶著代碼來的一律轉去 me.html。
// 代碼＝48 個隨機位元組：前 16 個是雲端節點代號、後 32 個是解密金鑰；# 後面的內容不會送到伺服器。
const LS_ME='erCommission_me', LS_NOTICE='erCommission_notice';
const VIEW_ONLY=!!window.VIEW_ONLY;
function parseViewTok(tok){
  try{
    const b=atob(String(tok).replace(/-/g,'+').replace(/_/g,'/')); if(b.length!==48) return null;
    const u=Uint8Array.from(b,ch=>ch.charCodeAt(0));
    return {tok,id:[...u.subarray(0,16)].map(x=>x.toString(16).padStart(2,'0')).join(''),key:btoa(String.fromCharCode.apply(null,u.subarray(16)))};
  }catch(e){ return null; }
}
// VIEW：null＝主任模式；{id,key,tok}＝個人查看；{none:true}＝個人查看入口但還沒有代碼（請他貼連結）

  // t／cfgT＝最後修改時間（毫秒），跨裝置合併時較新的為準；取消註記留 {del:1,t} 才能同步到別台。舊資料補 1。

function liveRates(){

// 每件點數可以每個月不同。某個月存過自己的一組（cfg.rateSets[月]）時，從那個月起適用，
// 直到下一個有自己設定的月份為止——沒有另外改的月份，就沿用前面最近的那一組。
// 比所有設定都早的月份用 liveRates()（最原始的那一份）。
function rateSetKey(key){   // 這個月實際用的是哪個月存的那一組；null＝原始設定
  const rs=state.cfg.rateSets||{}, ks=Object.keys(rs).filter(k=>k<=key&&rs[k]&&!rs[k].del).sort();
  return ks.length?ks[ks.length-1]:null;
}
function ratesFor(key){
  const o=liveRates(), sk=key?rateSetKey(key):null;
  if(!sk) return o;
  const r=state.cfg.rateSets[sk].r||{};
  Object.keys(o).forEach(pid=>{ const u=r[pid]; if(!u) return;
    FIELDS.forEach(f=>{ if(u[f]!=null&&u[f]!=='') o[pid][f]=Math.max(0,Number(u[f])||0); }); });
  return o;
}

// 某份設定裡某品項的每件點數。科部、品項點數是後來才加的：舊的月份快照沒有這些欄時先跟著現行設定，
// 等那個月下次有註記動作（ensureMonth）才寫進快照固定下來
function rateOf(cfg,pid,live){
  const r=cfg.products[pid]||ZERO, lv=((live||ratesFor(cur||''))[pid])||ZERO;
  return {doc:Number(r.doc)||0,promo:Number(r.promo)||0,pool:Number(r.pool)||0,
    fund:r.fund!=null?(Number(r.fund)||0):(lv.fund||0), price:r.price!=null?(Number(r.price)||0):(lv.price||0)};
}
function calcMonth(key,cfgOverride){
  const md=state.data.months[key], cfg=cfgOverride||monthCfg(key), live=ratesFor(key), rc={};
  const c={key,cfg,rows:(md&&md.rows)||[],gone:!!(md&&md.gone),prod:{},doc:{},np:{},pool:0,fund:0,fundIt:{},vendor:0,units:0,sales:0,noPrice:{},zeroRate:{}};
  c.rows.forEach(r=>Object.keys(r.it).forEach(pid=>{
    const q=r.it[pid], rt=rc[pid]||(rc[pid]=rateOf(cfg,pid,live));
    if(!cfg.products[pid]||!(rt.doc+rt.promo+rt.pool+rt.fund)) c.zeroRate[pid]=1;
    c.prod[pid]=(c.prod[pid]||0)+q; c.units+=q;
    c.sales+=q*rt.price; if(!rt.price) c.noPrice[pid]=1;
    const d=c.doc[r.doc]||(c.doc[r.doc]={it:{},amt:0}); d.it[pid]=(d.it[pid]||0)+q; d.amt+=q*rt.doc;
    const n=c.np[r.np]||(c.np[r.np]={it:{},promo:0,share:0}); n.it[pid]=(n.it[pid]||0)+q; n.promo+=q*rt.promo;
    c.pool+=q*rt.pool; c.vendor+=q*(rt.doc+rt.promo+rt.pool+rt.fund);
    if(rt.fund){ c.fund+=q*rt.fund; c.fundIt[pid]=(c.fundIt[pid]||0)+q; }
  }));
  // 平分池：整池除以名單人數，除不盡的零頭不計（列在提醒）
  const N=cfg.sharers.length;
  c.share=N?Math.floor(c.pool/N):0; c.poolLeft=c.pool-c.share*N;
  c.fund+=c.poolLeft;   // 除不盡的零頭（名單是空的時就是整池）歸到科部
  cfg.sharers.forEach(nm=>{ (c.np[nm]||(c.np[nm]={it:{},promo:0,share:0})).share=c.share; });
  return c;
}
// 這個月有紀錄的品項（依設定表的順序；設定表還沒有的新品項排最後）
function monthPids(c){

  return known.filter(pid=>c.prod[pid]).concat(Object.keys(c.prod).filter(pid=>!known.includes(pid)));
}
// 每人一列：role d=醫師 n=專師 f=科部（整個月一列，和個人一樣註記「已確認」）；沒填姓名的列不能確認（payable=false）
function people(c){
  const paid=paidOf(c.key), out=[], seen={};
  Object.keys(c.doc).forEach(n=>{ const d=c.doc[n];
    out.push({role:'d',name:n,pk:'d|'+n,it:d.it,promo:0,share:0,amt:Math.round(d.amt),payable:!!n}); });
  Object.keys(c.np).forEach(n=>{ const p=c.np[n];
    out.push({role:'n',name:n,pk:'n|'+n,it:p.it,promo:Math.round(p.promo),share:p.share,amt:Math.round(p.promo)+p.share,payable:!!n}); });
  if(c.fund>0) out.push({role:'f',name:'科部',pk:FUND_PK,it:c.fundIt,promo:0,share:0,amt:Math.round(c.fund),payable:true});
  out.forEach(p=>seen[p.pk]=1);
  // 已註記確認、但現在試算表算不到的人（事後改了姓名／刪了列）仍要列出來
  Object.keys(paid).forEach(pk=>{ if(!seen[pk]) out.push({role:pk[0],name:pk.slice(2),pk,it:{},promo:0,share:0,amt:0,payable:true}); });
  out.forEach(p=>p.rec=paid[p.pk]||null);
  return out.sort((a,b)=>(a.name==='')-(b.name==='')||b.amt-a.amt||a.name.localeCompare(b.name,'zh-Hant'));
}
function monthTotals(list){
  const t={due:0,paid:0,unpaid:0,over:0,todo:0};
  list.forEach(p=>{ if(!p.payable) return; t.due+=p.amt;
    const got=p.rec?p.rec.amt:0; t.paid+=got;
    if(p.amt>got){ t.unpaid+=p.amt-got; t.todo++; } else if(got>p.amt) t.over+=got-p.amt; });
  t.state=!t.due&&!t.paid?'empty':t.todo===0?'done':t.paid>0?'part':'none';
  return t;
}

// 今天新增的紀錄（看當月分頁裡日期是今天的列）與它們的點數
function todayInfo(){
  const d=new Date(), key=todayKey(), md=`${d.getMonth()+1}/${d.getDate()}`, c=calcMonth(key), live=ratesFor(key);
  const t={key,md,c,live,rows:c.rows.filter(r=>r.d===md),each:[],units:0,sales:0,promo:0,pool:0};
  t.rows.forEach(r=>{ let sum=0;   // each＝這一筆的品項點數（件數×品項點數）
    Object.keys(r.it).forEach(pid=>{ const q=r.it[pid], rt=rateOf(c.cfg,pid,live);
      t.units+=q; t.promo+=q*rt.promo; t.pool+=q*rt.pool; sum+=q*rt.price; });
    t.each.push(sum); t.sales+=sum; });
  return t;
}
// 某位專師今天增加的點數＝自己主要的＋平分多分到的（今天全體讓平分池變大，每人跟著多的那一份）
function todayMine(name){
  const t=todayInfo(), c=t.c, N=c.cfg.sharers.length;
  const rows=t.rows.filter(r=>r.np===name), each=rows.map(r=>Object.keys(r.it).reduce((x,pid)=>x+r.it[pid]*rateOf(c.cfg,pid,t.live).promo,0));
  const promo=each.reduce((a,b)=>a+b,0);
  const share=N&&c.cfg.sharers.includes(name)?c.share-Math.floor((c.pool-t.pool)/N):0;   // 用「現在每人的平分」減「不含今天時每人的平分」，和月合計對得起來
  return {t,rows,each,promo,share,total:promo+share,N,inPool:c.cfg.sharers.includes(name)};
}
function defaultKey(){
  const ks=allKeys(); if(!ks.length) return null;
  const now=todayKey();   // 打開時先看當月；當月還沒有資料就看最新的一個月
  return ks.includes(now)?now:ks[ks.length-1];
}

// ---------- 讀 Google 試算表（gviz JSONP；file:// 開啟時 fetch 會被 CORS 擋） ----------
function sheetId(url){
  const s=String(url||'').trim(), m=s.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
  return m?m[1]:(/^[a-zA-Z0-9_-]{30,}$/.test(s)?s:null);
}
function gviz(id,params,headers,timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb='__gviz'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const s=document.createElement('script'); let done=false;
    // 逾時後晚到的回應會呼叫已移除的 callback——留一個空函式接住
    const fin=()=>{ done=true; clearTimeout(t); window[cb]=function(){}; s.remove(); };
    const t=setTimeout(()=>{ if(!done){ fin(); reject(new Error('連線逾時')); } },timeoutMs||20000);
    window[cb]=d=>{ if(done) return; fin();
      if(d&&d.status==='error') reject(new Error((d.errors&&d.errors[0]&&(d.errors[0].detailed_message||d.errors[0].message))||'試算表回傳錯誤'));
      else resolve(d); };
    s.onerror=()=>{ if(!done){ fin(); reject(new Error('讀不到試算表（沒有網路，或試算表已改成不公開）')); } };
    s.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=${headers==null?1:headers}&${params}`;
    document.head.appendChild(s);
  });
}
const gcell=c=>c==null?null:(c.v!=null?c.v:(c.f!=null?c.f:null));
const normLabel=l=>String(l==null?'':l).replace(/\s+/g,'');
function classify(label){
  const s=normLabel(label); if(!s) return null;
  if(/^(序|序號|編號)$/.test(s)) return {kind:'seq'};
  if(/日期/.test(s)) return {kind:'date'};
  if(/病歷|姓名|身分/.test(s)) return {kind:'phi'};        // 個資欄：不下載
  if(/專師|專科護理|^NP$/i.test(s)) return {kind:'np'};
  if(/醫師/.test(s)) return {kind:'doc'};
  const p=PRODUCTS.find(p=>p.re.test(s)); if(p) return {kind:'prod',pid:p.id};
  if(/^(備註|說明|電話|床|科別|統計|合計)/.test(s)) return {kind:'skip'};
  return {kind:'maybe',pid:'x:'+s,label:s};   // 不認得的欄：確定是數字欄才當新品項
}
function qty(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return isFinite(v)&&v>0?v:0;
  const s=String(v).trim();
  if(/^\d+(\.\d+)?$/.test(s)) return Number(s);
  return /^[vV✓✔○●]$/.test(s)?1:0;
}
// 回傳 {y,m,d}；認得 gviz 的 Date(2026,8,3)、Excel 序號、2026/9/3、115/9/3、9/3
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:{y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate()};
  if(typeof v==='number'){
    if(v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}; }
    return null;
  }
  const s=String(v).trim(); let m;
  if((m=s.match(/^Date\((\d+),(\d+),(\d+)/))) return {y:+m[1],m:+m[2]+1,d:+m[3]};
  if((m=s.match(/^(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/))){ let y=+m[1]; if(y<1000) y+=1911; return {y,m:+m[2],d:+m[3]}; }
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/))) return {y:null,m:+m[1],d:+m[2]};
  return null;
}
// rows: [{seq,date,cnt:{pid:n},np,doc}]；tabM＝分頁名稱的月份。月份以分頁為準、年份取該分頁多數列的年份
function addRows(acc,rows,tabM){
  const yrs={};
  rows.forEach(r=>{ if(r.date&&r.date.y) yrs[r.date.y]=(yrs[r.date.y]||0)+1; });
  const yTop=Number(Object.keys(yrs).sort((a,b)=>yrs[b]-yrs[a])[0])||new Date().getFullYear();
  rows.forEach(r=>{
    const tot=sumVals(r.cnt); if(tot<=0) return;
    let m=r.date&&r.date.m;
    if(tabM){ if(m&&m!==tabM) acc.mismatch++; m=tabM; }
    if(!m){ acc.undated+=tot; return; }
    const y=tabM?yTop:((r.date&&r.date.y)||yTop), key=`${y-1911}-${pad(m)}`;
    (acc.months[key]||(acc.months[key]={rows:[]})).rows.push({
      n:r.seq!=null&&r.seq!==''?r.seq:'', d:r.date&&r.date.d?`${r.date.m}/${r.date.d}`:'',
      np:normName(r.np), doc:normName(r.doc), it:r.cnt});
  });
}
function parseRoster(colA){
  const out={np:[],doc:[]}; let i=colA.indexOf('專師');
  if(i<0) return out;
  for(i++;i<colA.length&&colA[i]&&colA[i]!=='醫師';i++) out.np.push(colA[i]);
  if(colA[i]==='醫師') for(i++;i<colA.length&&colA[i];i++) out.doc.push(colA[i]);
  return out;
}
async function sheetLayout(id){
  const enc=encodeURIComponent, tabs=[...Array(12)].map((_,i)=>`${i+1}月`);
  // 各分頁只抓表頭。注意：分頁不存在時 Google 不報錯、會默默回「第一個分頁」，抓資料後再用內容去重
  const [heads,ros]=await Promise.all([
    Promise.all(tabs.map(t=>gviz(id,`sheet=${enc(t)}&tq=${enc('limit 0')}`).catch(e=>({err:e})))),
    gviz(id,`sheet=${enc('統計')}&tq=${enc('select A')}`,0).catch(()=>null),
  ]);
  // 任一分頁表頭讀失敗＝連線問題，整次作廢（略過失敗分頁照做的話，該月內容會被別的分頁的回聲頂替成別的月份）
  const hErr=heads.find(h=>h.err); if(hErr) throw hErr.err;
  const jobs=heads.map((h,i)=>{
    const map={prod:[]}, pick=[], labels=[];
    ((h.table&&h.table.cols)||[]).forEach(c=>{
      const k=classify(c.label); if(!k) return;
      let use=false;
      if(k.kind==='seq'&&!map.seq){ map.seq=c.id; use=true; }
      else if(k.kind==='date'&&!map.date){ map.date=c.id; use=true; }
      else if(k.kind==='np'&&!map.np){ map.np=c.id; use=true; }
      else if(k.kind==='doc'&&!map.doc){ map.doc=c.id; use=true; }
      else if(k.kind==='prod'||(k.kind==='maybe'&&c.type==='number')){ map.prod.push({id:c.id,pid:k.pid,label:k.label}); use=true; }
      if(use){ pick.push(c.id); labels.push(normLabel(c.label)); }
    });
    if(!map.np||!map.prod.length) return null;   // 不是使用紀錄分頁
    return {tab:tabs[i],tabM:i+1,map,pick,labels};
  });
  // 名單：統計頁 A 欄「專師」底下到「醫師」為止是專師，之後到空白為止是醫師
  const rt=ros&&ros.table, colA=[];
  if(rt){ const lab=normName(rt.cols&&rt.cols[0]&&rt.cols[0].label); if(lab) colA.push(lab);
    (rt.rows||[]).forEach(r=>colA.push(normName(gcell(r.c&&r.c[0])))); }
  return {jobs,roster:parseRoster(colA)};
}
async function fetchSheet(url){
  const id=sheetId(url); if(!id) throw new Error('試算表網址格式不對');
  const enc=encodeURIComponent, lay=await sheetLayout(id), jobs=lay.jobs;
  const datas=await Promise.all(jobs.map(j=>j?gviz(id,`sheet=${enc(j.tab)}&tq=${enc('select '+j.pick.join(','))}`).catch(e=>({err:e})):null));
  // 表頭與資料之間有人插欄／搬欄，或某分頁讀失敗 → 整次作廢、保留舊資料（下次再讀）
  const bad=datas.find((d,i)=>jobs[i]&&d&&(d.err||!d.table||d.table.cols.map(c=>normLabel(c.label)).join('|')!==jobs[i].labels.join('|')));
  if(bad) throw bad.err||new Error('試算表欄位剛好有變動，請再按一次更新');
  // 同內容的回應只算一次；優先留「分頁月份＝多數列日期月份」的那份（其餘是不存在分頁回的第一頁）
  const groups={};
  datas.forEach((d,i)=>{
    if(!d||!d.table) return;
    const j=jobs[i], idx={}; d.table.cols.forEach((c,ci)=>idx[c.id]=ci);
    const rows=(d.table.rows||[]).map(r=>{ const c=r.c||[], cnt={};
      j.map.prod.forEach(p=>{ const n=qty(gcell(c[idx[p.id]])); if(n) cnt[p.pid]=(cnt[p.pid]||0)+n; });
      return {seq:j.map.seq?gcell(c[idx[j.map.seq]]):null, date:j.map.date?parseDate(gcell(c[idx[j.map.date]])):null, cnt,
              np:gcell(c[idx[j.map.np]]), doc:j.map.doc?gcell(c[idx[j.map.doc]]):null,
              k:JSON.stringify(c.map(gcell))}; })   // k＝原始儲存格，只用來比對回聲
      .filter(r=>Object.keys(r.cnt).length);
    if(!rows.length) return;
    const ms={}; rows.forEach(r=>{ if(r.date&&r.date.m) ms[r.date.m]=(ms[r.date.m]||0)+1; });
    const domM=Number(Object.keys(ms).sort((a,b)=>ms[b]-ms[a])[0])||null;
    const sig=JSON.stringify(d.table.rows), g=groups[sig];
    const cand={tabM:j.tabM,domM,rows,extra:j.map.prod.filter(p=>p.label).map(p=>p.label),good:domM===j.tabM,n:(g?g.n:0)+1};
    if(!g||(!g.good&&cand.good)) groups[sig]=cand; else g.n=cand.n;
  });
  // 多數列月份和分頁名稱對不上的內容：
  //  ・跟已採用分頁大半相同 → 是「第一個分頁」的回聲（有人正在輸入，各分頁回應差一兩列）→ 略過
  //  ・只有一個分頁回這份 → 真的分頁、只是日期打錯 → 照分頁月份計
  //  ・好幾個分頁都回這份、又沒有一頁月份對得上 → 無法判斷是哪個月，不計、出提醒
  const gs=Object.values(groups), goodK={};
  gs.forEach(g=>{ if(g.good) g.rows.forEach(r=>goodK[r.k]=(goodK[r.k]||0)+1); });
  const acc={months:{},extra:{},undated:0,mismatch:0,dropped:0,roster:lay.roster};
  gs.forEach(g=>{
    if(g.domM!=null&&!g.good){
      const left={...goodK}; let hit=0;
      g.rows.forEach(r=>{ if(left[r.k]>0){ left[r.k]--; hit++; } });
      if(hit>=g.rows.length/2) return;
      if(g.n>1){ acc.dropped+=g.rows.reduce((t,r)=>t+sumVals(r.cnt),0); return; }
    }
    addRows(acc,g.rows,g.tabM); g.extra.forEach(l=>acc.extra[l]=1);
  });
  return acc;
}
// 備援：試算表改成不公開後，改上傳「檔案→下載→Microsoft Excel」的 xlsx
function parseWorkbook(wb){
  const acc={months:{},extra:{},undated:0,mismatch:0,dropped:0,roster:{np:[],doc:[]}};
  wb.SheetNames.forEach(name=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(/統計/.test(name)){ acc.roster=parseRoster(aoa.map(r=>normName(r&&r[0]))); return; }
    const mm=name.match(/(\d{1,2})\s*月/), tabM=mm&&+mm[1]>=1&&+mm[1]<=12?+mm[1]:null;
    for(let hi=0;hi<Math.min(6,aoa.length);hi++){
      const map={prod:[]};
      (aoa[hi]||[]).forEach((lbl,ci)=>{
        const k=classify(lbl); if(!k) return;
        if(k.kind==='seq'&&map.seq==null) map.seq=ci;
        else if(k.kind==='date'&&map.date==null) map.date=ci;
        else if(k.kind==='np'&&map.np==null) map.np=ci;
        else if(k.kind==='doc'&&map.doc==null) map.doc=ci;
        else if(k.kind==='prod') map.prod.push({ci,pid:k.pid});
        else if(k.kind==='maybe'){
          const vals=aoa.slice(hi+1).map(r=>r&&r[ci]).filter(v=>v!=null&&v!=='');
          if(vals.length&&vals.every(v=>typeof v==='number'||/^\d+(\.\d+)?$/.test(String(v).trim()))) map.prod.push({ci,pid:k.pid,label:k.label});
        }
      });
      if(map.np==null||!map.prod.length) continue;
      const rows=aoa.slice(hi+1).map(r=>{ r=r||[]; const cnt={};
        map.prod.forEach(p=>{ const n=qty(r[p.ci]); if(n) cnt[p.pid]=(cnt[p.pid]||0)+n; });
        return {seq:map.seq!=null?r[map.seq]:null,date:map.date!=null?parseDate(r[map.date]):null,cnt,np:r[map.np],doc:map.doc!=null?r[map.doc]:null}; });
      addRows(acc,rows,tabM);
      map.prod.forEach(p=>{ if(p.label) acc.extra[p.label]=1; });
      break;
    }
  });
  return acc;
}
// 每次都是整份讀，所以「這次涵蓋的年度」裡原本有、這次沒有的月份要清掉（試算表刪列／誤判月份才不會殘留）；
// 但已有確認紀錄的月份不清，保留最後一次讀到的內容並標 gone，免得對不回去。其他年度原封不動。
function mergeResult(acc,source){
  const D=state.data, keys=Object.keys(acc.months).sort();
  const cnt=k=>D.months[k]?D.months[k].rows.reduce((t,r)=>t+sumVals(r.it),0):0;
  const before=JSON.stringify([D.months,D.roster,D.extra]), cntBefore={};
  Object.keys(D.months).forEach(k=>cntBefore[k]=cnt(k));
  if(keys.length){
    const yrs=new Set(keys.map(k=>k.split('-')[0]));
    Object.keys(D.months).forEach(k=>{ if(!yrs.has(k.split('-')[0])||acc.months[k]) return;
      if(Object.keys(paidOf(k)).length) D.months[k].gone=true; else delete D.months[k]; });
    keys.forEach(k=>{ D.months[k]={rows:acc.months[k].rows}; });
  }
  if(acc.roster.np.length) D.roster=acc.roster;
  Object.assign(D.extra,acc.extra);
  const changed=JSON.stringify([D.months,D.roster,D.extra])!==before, now=new Date().toISOString();
  D.checked=now; if(changed||!D.changed) D.changed=now;
  D.source=source; D.warn={undated:acc.undated,mismatch:acc.mismatch,dropped:acc.dropped||0};
  saveState(true);
  const dl=[...new Set([...Object.keys(cntBefore),...Object.keys(D.months)])].sort().map(k=>{
    const d=cnt(k)-(cntBefore[k]||0); return d?`${Number(k.split('-')[1])}月 ${d>0?'+':''}${d} 件`:''; }).filter(Boolean).join('、');
  return {changed,delta:dl};
}
async function refresh(silent){
  if(busy) return;
  if(VIEW&&!sheetUrl()){ loadView(); return; }
  const url=sheetUrl();
  if(!url){ if(!silent){ $('card-cfg').open=true; alert('還沒設定試算表網址，請到最下方「其他設定」貼上。'); } renderStatus(); return; }
  busy=true; renderStatus();
  try{
    const r=mergeResult(await fetchSheet(url),'sheet');
    fail=null; if(r.delta) delta={txt:r.delta,at:Date.now()};
    busy=false;
    if(r.changed) publishViews();
    if(r.changed||!silent||!cur) renderAll(); else renderStatus();
  }catch(e){
    busy=false; fail={at:new Date().toISOString(),msg:(e&&e.message)||String(e)};
    renderStatus(); if(!silent) alert('讀取試算表失敗：'+fail.msg+'\n\n畫面上保留的是上次讀到的資料。');
  }
}

function renderYear(){

    return `<td class="ycell u" title="還沒確認">${fmt(p.amt)}</td>`; };
  const sect=(role,title)=>{

      const tot=mks.reduce((s,k)=>s+(x.m[k]?x.m[k].amt:0),0), paid=mks.reduce((s,k)=>s+(x.m[k]&&x.m[k].rec?x.m[k].rec.amt:0),0);

function pieCard(title,parts){

  if(!tot) return '';

    g+=`<path d="M${f(cx+R*co(a))} ${f(cy+R*si(a))}A${R} ${R} 0 ${big} 1 ${f(cx+R*co(b))} ${f(cy+R*si(b))}L${f(cx+r*co(b))} ${f(cy+r*si(b))}A${r} ${r} 0 ${big} 0 ${f(cx+r*co(a))} ${f(cy+r*si(a))}Z" fill="${x.c}" stroke="#fff" stroke-width="1.5"/>`;

// 折線圖（純 SVG，不用外部函式庫）。pts=[{k:'115-10',v:數值}]，curKey 那一點用橘色標出來
function lineSvg(pts,curKey){

  const e=Math.pow(10,Math.floor(Math.log10(max))), top=[1,2,2.5,5,10].map(f=>f*e).find(v=>v>=max)||max;   // 縱軸上限取整齊的數
  const x=i=>n===1?L+(W-L-R)/2:L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let i=0;i<=4;i++){ const v=top*i/4, yy=y(v);
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#dfe6ee" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#6b7a8c">${fmt(v)}</text>`; }
  if(n>1) g+=`<polyline fill="none" stroke="#1a4a7a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`;
  let lastY=null;
  pts.forEach((p,i)=>{ const [yy,mm]=p.k.split('-').map(Number), on=p.k===curKey, show=n<=12||on||i===n-1;
    g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${on?5.5:4}" fill="${on?'#f2a541':'#1a4a7a'}" stroke="#fff" stroke-width="1.5"/>`+
      (show?`<text x="${x(i)+(n>1&&i===0?4:n>1&&i===n-1?-4:0)}" y="${y(p.v)-10}" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" font-size="11" font-weight="700" fill="${on?'#a85800':'#12355a'}">${fmt(p.v)}</text>`:'')+
      `<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#1f2d3d">${mm}月</text>`+
      (yy!==lastY?`<text x="${x(i)}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="#6b7a8c">${yy}年</text>`:'');
    lastY=yy; });
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

// 第一次註記時把當下的設定存成這個月的快照
function ensureMonth(key){
  const pm=state.pay[key]||(state.pay[key]={}); pm.paid=pm.paid||{};
  if(!pm.cfg){ pm.cfg=clone(cfgFor(key)); pm.cfgT=Date.now(); }
  else{   // 加科部之前留下的快照：把現行的科部點數寫進去固定下來
    const live=ratesFor(key); let ch=false;
    Object.keys(pm.cfg.products||{}).forEach(pid=>{ const r=pm.cfg.products[pid]; if(!r) return;
      ['fund','price'].forEach(f=>{ if(r[f]==null){ r[f]=(live[pid]||ZERO)[f]; ch=true; } }); });
    if(ch) pm.cfgT=Date.now();
  }
  return pm;
}

async function seal(obj,key){

// 資料庫規則要求登入：用 REST 匿名登入拿 idToken（使用者無感）；之後用 refresh token 續用同一個匿名身分
async function idToken(force){
  if(!force&&_tok&&Date.now()<_tokExp) return _tok;
  const keep=d=>{ _tok=d.idToken||d.id_token; _tokExp=Date.now()+(Number(d.expiresIn||d.expires_in||3600)-60)*1000;
    const rt=d.refreshToken||d.refresh_token; if(rt){ try{ localStorage.setItem(LS_RT,rt); }catch(e){} } return _tok; };
  let rt=null; try{ rt=localStorage.getItem(LS_RT); }catch(e){}
  if(rt){
    const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
    if(r.ok) return keep(await r.json());
  }
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok) throw new Error('雲端登入失敗（HTTP '+r.status+'）');
  return keep(await r.json());
}
async function cloudReq(method,body,id){
  for(let i=0;;i++){
    const r=await fetch(`${FB_DB}/${FB_NODE}/${id||sync.id}.json?auth=${encodeURIComponent(await idToken(i>0))}`,
      {method,cache:'no-store',body:body==null?undefined:JSON.stringify(body)});
    if(r.ok) return r.json();
    const msg=await r.text().catch(()=>'');
    if((r.status===401||r.status===403)&&i===0&&/expired|invalid/i.test(msg)) continue;   // token 過期：重拿一次
    if(r.status===401||r.status===403) throw Object.assign(new Error('雲端規則尚未開放這個 App'),{kind:'denied'});
    throw new Error('雲端回應 HTTP '+r.status);
  }
}

// 把雲端內容併進本機，回傳本機有沒有變。點數／平分名單／網址各自看修改時間，確認註記逐人逐月看修改時間，較新的為準
function mergeRemote(rm){

  if((rc.tS||0)>(c.tS||0)){ c.sharers=Array.isArray(rc.sharers)?rc.sharers.slice():null; c.tS=rc.tS; ch=true; }

    const r=rm.pay[k]||{}, l=state.pay[k]||(state.pay[k]={paid:{}}); l.paid=l.paid||{};
    if((r.cfgT||0)>(l.cfgT||0)){ l.cfg=r.cfg||null; l.cfgT=r.cfgT; ch=true; }

  });

}

async function syncNow(){
  if(!sync) return;
  if(_syncBusy){ _syncAgain=true; return; }
  _syncBusy=true; if(syncSt.k!=='ok') setSync('busy');
  try{
    const blob=await cloudReq('GET');
    if(blob&&blob.wipe){ wipeLocal(); return; }   // 這組密碼已經被更換作廢
    let remote=null;
    if(blob&&blob.data){ try{ remote=await unseal(blob); }catch(e){ throw new Error('雲端資料解不開'); } }
    if(!remote&&sync.unverified){   // 金鑰是在雲端還沒開通時存的，現在才知道雲端上沒有這組密碼的資料
      if(!confirmNewSpace()){ sync=null; try{ localStorage.removeItem(LS_SYNC); }catch(e){} setSync('off'); return; }
    }
    if(sync.unverified){ delete sync.unverified; localStorage.setItem(LS_SYNC,JSON.stringify(sync)); }
    const hadUrl=!!sheetUrl();
    let ch=!!(remote&&mergeRemote(remote));
    if(applyDefaults()) ch=true;   // 先併完雲端再補預設值，才不會蓋掉別台裝置剛改的數字
    if(ch){ saveState(true); renderAll(); }
    const mine=buildPayload();
    if(!remote||stable(mine)!==stable(remote)) await cloudReq('PUT',await seal(mine));
    setSync('ok');
    if(!hadUrl&&sheetUrl()) refresh(true);
    if(ch) publishViews();   // 別台裝置改了點數或註記 → 個人查看的內容也要更新
  }catch(e){
    setSync(e.kind==='denied'?'denied':(navigator.onLine===false?'offline':'error'),(e&&e.message)||String(e));

// 把解開的內容套成一般的設定格式，之後照常用 calcMonth 算。平分名單只知道人數，用佔位名字補滿
function applyView(b){
  const full=r=>{ const o={}; Object.keys(r||{}).forEach(pid=>{ o[pid]={doc:0,promo:Number(r[pid].promo)||0,pool:Number(r[pid].pool)||0,fund:0,price:0}; }); return o; };
  const pool=(n,inPool)=>{ const a=inPool?[b.name]:[]; while(a.length<(Number(n)||0)) a.push('\u0001'+a.length); return a; };
  state.cfg.rates=full(b.rates); state.cfg.sharers=pool(b.n,b.inPool); state.cfg.url=b.url||'';
  state.cfg.rateSets={}; Object.keys(b.sets||{}).forEach(k=>{ state.cfg.rateSets[k]={r:full(b.sets[k]),t:0}; });
  state.pay={};
  Object.keys(b.months||{}).forEach(k=>{ const m=b.months[k], pm=state.pay[k]={paid:{}};
    if(m.rates) pm.cfg={products:full(m.rates),sharers:pool(m.n,m.inPool)};
    if(m.paid) pm.paid['n|'+b.name]={amt:m.paid.amt,at:m.paid.at,t:1}; });
}
async function loadView(){
  if(!VIEW) return;
  if(VIEW.none){ viewInfo=null; viewErr='none'; renderAll(); return; }
  try{
    const blob=await cloudReq('GET',null,VIEW.id);
    let b=null;
    if(blob&&blob.data){ try{ b=await unseal(blob,VIEW.key); }catch(e){ b=null; } }
    if(!b){ viewInfo=null; viewErr='gone'; }
    else{ const first=!viewInfo, sig=stable(b);
      if(first||viewInfo.sig!==sig){ applyView(b); viewInfo={name:b.name,inPool:!!b.inPool,sig}; }
      viewErr=null;
      if(first){ renderAll(); refresh(true); return; }
    }
  }catch(e){ if(!viewInfo) viewErr='net'; }
  renderAll();
}

// ---------- 事件 ----------
function act(a,t,ev){
  const k=t.dataset.k;
  if(VIEW&&!/^(refresh|month|mstep|mpick|myear|today|trend|close|me-forget|me-install|me-paste)$/.test(a)) return;   // 個人查看模式只能看
  if(a==='refresh'){ if(VIEW) loadView(); refresh(false); }
  else if(a==='me-install'){ if(_installEvt){ const e=_installEvt; _installEvt=null; e.prompt(); } }
  else if(a==='me-paste'){
    const m=String(($('me-link')||{}).value||'').match(/me=([A-Za-z0-9_-]{64})/);
    if(!m||!parseViewTok(m[1])){ alert('這看起來不是個人查看連結。\n請把主任傳給你的整條連結完整貼上（後面有一長串英數字）。'); return; }
    if(VIEW_ONLY||location.protocol==='file:'){ try{ if(VIEW_ONLY) localStorage.setItem(LS_ME,m[1]); }catch(e){} location.hash='me='+m[1]; location.reload(); }
    else location.href='me.html#me='+m[1];   // 個人查看一律走專用入口
  }
  else if(a==='me-open') location.href='me.html';
  else if(a==='me-forget'){
    if(!confirm('在這台裝置移除這個連結？\n之後要再看，需要重新打開主任給的連結。')) return;
    try{ localStorage.removeItem(LS_ME); }catch(e){} location.href=location.pathname;
  }
  else if(a==='view-new') newView(t.dataset.n);
  else if(a==='view-del'){
    const n=t.dataset.n, v=state.cfg.views[n]; if(!v||v.del) return;
    if(!confirm(`停用「${n}」的查看連結？\n停用後那條連結立刻失效，之後可以再建立新的。`)) return;
    state.cfg.views[n]={del:1,t:Date.now(),tok:v.tok}; saveState(); renderCfg(); publishViews();
  }
  else if(a==='view-copy'){
    const v=state.cfg.views[t.dataset.n]; if(!v||!v.tok) return;
    const url=viewUrl(v.tok), done=()=>{ const o=t.textContent; t.textContent='✓ 已複製'; setTimeout(()=>{ t.textContent=o; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt('請複製這條連結：',url));
    else prompt('請複製這條連結：',url);
  }
  else if(a==='month') switchMonth(k);
  else if(a==='mstep') switchMonth(_mbKeys[_mbKeys.indexOf(cur)+Number(t.dataset.d)]);
  else if(a==='mpick'){ pickOpen=!pickOpen; pickYear=null; renderAll(); }
  else if(a==='myear'){ const ys=[...new Set(_mbKeys.map(x=>+x.split('-')[0]))], y=ys[ys.indexOf(pickYear)+Number(t.dataset.d)]; if(y){ pickYear=y; renderAll(); } }
  else if(a==='pay'||a==='repay') doPay(k);
  else if(a==='unpay') doUnpay(k);
  else if(a==='payall') doPayAll(t.dataset.role);
  else if(a==='date'){ const r=state.pay[cur]&&state.pay[cur].paid[k]; if(r&&!r.del&&t.value){ r.at=t.value; r.t=Date.now(); saveState(); renderYear(); } }
  else if(a==='resnap'){
    if(!confirm(`${keyLabel(cur)}改用現在的設定重算？\n已經確認的點數不會變，若新算法的點數不同，會在該列提醒差額。`)) return;
    state.pay[cur].cfg=clone(cfgFor(cur)); state.pay[cur].cfgT=Date.now(); saveState(); renderAll();
  }
  else if(a==='detail') showDetail(k);
  else if(a==='today') showToday();
  else if(a==='trend') showTrend(t.dataset.m);
  else if(a==='close') $('mask').classList.remove('on');
  else if(a==='year'){ yearSel=t.value; renderYear(); }
  else if(a==='rate'){
    // 只記進草稿，按「儲存」才生效；改回原本的數字＝沒有修改
    const pid=t.dataset.pid, f=t.dataset.f, d=rateDraft[pid]||(rateDraft[pid]={});
    if(t.value!==''&&Number(t.value)===monthRates(cur)[pid][f]) delete d[f]; else d[f]=t.value;
    if(!Object.keys(d).length) delete rateDraft[pid];
    t.classList.toggle('chg',!!(rateDraft[pid]&&f in rateDraft[pid]));
    refreshCfgRow(pid); renderRateSave();
  }
  else if(a==='rate-save'){
    if(!draftDirty()||!cur) return;
    // 存成「這個月的一組」：從這個月起適用，之後沒另外改的月份沿用它；之前的月份不動
    const full=draftRates(), now=Date.now(), pm=state.pay[cur];
    state.cfg.rateSets[cur]={r:clone(full),t:now};
    if(pm&&pm.cfg){ pm.cfg.products=clone(full); pm.cfgT=now; }   // 這個月已有確認紀錄（點數固定在快照裡）→ 快照一起改，已確認的人會顯示差額
    rateDraft={}; saveState();
    if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
    renderAll();
  }
  else if(a==='rate-inherit'){
    const rs=state.cfg.rateSets; if(!cur||!rs[cur]||rs[cur].del) return;
    if(!confirm(`${keyLabel(cur)}不要自己的設定，改回沿用前面的？\n（之後沒有另外修改的月份也會跟著變）`)) return;
    const now=Date.now(), pm=state.pay[cur];
    rs[cur]={del:1,t:now}; rateDraft={};
    if(pm&&pm.cfg){ pm.cfg.products=clone(ratesFor(cur)); pm.cfgT=now; }
    saveState(); renderAll();
  }
  else if(a==='rate-cancel'){
    rateDraft={}; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); renderAll();
  }
  else if(a==='sharer-add'){
    const n=normName($('sharer-new').value); if(!n) return;
    const sh=liveSharers(); if(sh.includes(n)){ alert('名單上已經有「'+n+'」'); return; }
    sh.push(n); state.cfg.sharers=sh; state.cfg.tS=Date.now(); saveState(); $('sharer-new').value=''; document.activeElement.blur(); renderAll();
  }
  else if(a==='sharer-del'){
    const n=t.dataset.n;
    if(!confirm(`把「${n}」移出平分名單？\n（只影響還沒確認過的月份；他的主要點數照算）`)) return;
    state.cfg.sharers=liveSharers().filter(x=>x!==n); state.cfg.tS=Date.now(); saveState(); renderAll();
  }
  else if(a==='sharer-reset'){ state.cfg.sharers=null; state.cfg.tS=Date.now(); saveState(); renderAll(); }
  else if(a==='url-save'){
    const v=$('cfg-url').value.trim();
    if(v&&!sheetId(v)){ alert('看起來不是 Google 試算表網址（應該長得像 https://docs.google.com/spreadsheets/d/…）'); return; }
    if(v&&v!==window.COMMISSION_SHEET_URL) state.cfg.url=v; else delete state.cfg.url;
    state.cfg.tU=Date.now(); saveState(); document.activeElement.blur(); refresh(false);
  }
  else if(a==='upload'){
    const f=t.files&&t.files[0]; t.value=''; if(!f) return;
    loadXLSX().then(()=>f.arrayBuffer()).then(buf=>{
      const acc=parseWorkbook(XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true}));
      if(!Object.keys(acc.months).length){ alert('這個檔案裡找不到使用紀錄（需要有「專師」欄與品項數量欄的月份分頁）。'); return; }
      mergeResult(acc,'upload'); fail=null; renderAll();
    }).catch(e=>alert('讀取失敗：'+(e&&e.message||e)));
  }
  else if(a==='sync-on'){ const inp=$(t.dataset.src); if(inp) enableSync(inp.value); }
  else if(a==='sync-now') syncNow();
  else if(a==='sync-chpw'){ const inp=$(t.dataset.src); if(inp) changeSyncPw(inp.value).then(()=>{ if(sync&&sync.strong) inp.value=''; }); }
  else if(a==='notice-ok'){ _notice=null; try{ localStorage.removeItem(LS_NOTICE); }catch(e){} renderAlerts(); }
  else if(a==='sync-off'){
    if(!confirm('在這台裝置關閉雲端同步？\n\n這台裝置上的資料會留著，雲端上的也不會被刪除；之後要再同步，重新輸入同一組密碼即可。')) return;
    sync=null; try{ localStorage.removeItem(LS_SYNC); }catch(e){} setSync('off');
  }
  else if(a==='goto-sync'){ $('card-cfg').open=true; renderCfg(); const h=$('sync-h'); if(h) h.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(a==='force-update') forceUpdate();
  else if(a==='backup-export') download(`急診點數備份_${today().replace(/-/g,'')}.json`,JSON.stringify(state),'application/json');
  else if(a==='backup-import'){
    const f=t.files&&t.files[0]; t.value=''; if(!f) return;
    f.text().then(txt=>{
      let s; try{ s=JSON.parse(txt); }catch(e){ alert('這不是備份檔（讀不出 JSON）。'); return; }
      if(!s||typeof s!=='object'||!s.pay||!s.cfg){ alert('這不是本系統的備份檔。'); return; }
      const live=k=>Object.values((s.pay[k]&&s.pay[k].paid)||{}).filter(r=>r&&!r.del).length;
      const n=Object.keys(s.pay).reduce((a,k)=>a+live(k),0);
      if(!confirm(`匯入這份備份（${Object.keys(s.pay).filter(live).length} 個月、${n} 筆確認註記）？\n\n目前這台裝置上的設定與確認註記會被它整個取代。`)) return;
      state=normState(s);
      // 匯入的內容視為「現在改的」，開著雲端同步時才不會被雲端上較舊的蓋回去
      const now=Date.now(); state.cfg.tR=state.cfg.tS=now; if(state.cfg.url) state.cfg.tU=now;
      Object.values(state.pay).forEach(pm=>{ if(pm.cfgT) pm.cfgT=now; Object.values(pm.paid).forEach(r=>r.t=now); });
      saveState(); cur=null; renderAll(); refresh(true);
    });
  }
}
document.addEventListener('click',e=>{
  if(e.target===$('mask')){ $('mask').classList.remove('on'); return; }
  if(pickOpen&&!e.target.closest('#mpick')&&!e.target.closest('#monthbar')){ pickOpen=false; $('mpick').classList.remove('on'); }   // 點月份選單外面＝收起來
  const t=e.target.closest('[data-act]'); if(!t||t.tagName==='INPUT'||t.tagName==='SELECT') return;
  act(t.dataset.act,t,'click');
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.act&&(t.tagName==='INPUT'||t.tagName==='SELECT')) act(t.dataset.act,t,'change'); });
// 點數表邊打邊更新右邊的試算欄與「還沒儲存」的提示（按儲存才真的生效）
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='rate') act('rate',t,'input'); });
// 卡片收合／展開（toggle 不會冒泡，要用 capture）→ 記在這台裝置
document.addEventListener('toggle',e=>{ const d=e.target;
  if(!d.dataset||!d.dataset.sec||isOpen(d.dataset.sec)===d.open) return;   // 和已記的狀態相同（含剛畫出來時瀏覽器自動發的事件）就不用記
  ui[d.dataset.sec]=d.open;
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') $('mask').classList.remove('on');
  if(e.key==='Enter'&&e.target.id==='sharer-new') act('sharer-add',e.target);
  if(e.key==='Enter'&&e.target.id==='cfg-url') act('url-save',e.target);
  if(e.key==='Enter'&&(e.target.id==='sync-pw'||e.target.id==='setup-pw')) enableSync(e.target.value);
  if(e.key==='Enter'&&e.target.id==='me-link') act('me-paste',e.target);
  if(e.key==='Enter'&&(e.target.id==='sync-newpw'||e.target.id==='top-newpw')) changeSyncPw(e.target.value);
});
// 點數表有還沒儲存的修改時，關掉或重新整理前先提醒
window.addEventListener('beforeunload',e=>{ if(!VIEW&&draftDirty()){ e.preventDefault(); e.returnValue=''; } });
// 已經開著 App 的分頁貼上個人連結只會換 # 後面、不會重新載入 → 手動重載才會進個人查看模式
window.addEventListener('hashchange',()=>{ const m=location.hash.match(/[#&]me=([A-Za-z0-9_-]{64})/); if(m&&(!VIEW||VIEW.tok!==m[1])) location.reload(); });
// 另一個分頁改了資料 → 這邊跟著更新
window.addEventListener('storage',e=>{
  if(VIEW) return;
  if(e.key===LS){ state=loadState(); renderAll(); }
  if(e.key===LS_SYNC){ try{ sync=JSON.parse(e.newValue||'null'); }catch(_){ sync=null; } setSync(sync?'idle':'off'); if(sync) syncNow(); }
});
// 回到視窗超過 1 分鐘沒讀過就補讀；開著時每 5 分鐘讀一次
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  if(VIEW) loadView();
  if(Date.now()-(Date.parse(state.data.checked||0)||0)>60000) refresh(true);
  if(sync) syncNow();
});
setInterval(()=>{ if(sync&&document.visibilityState==='visible') syncNow(); },60*1000);
setInterval(()=>{ if(document.visibilityState==='visible') refresh(true); },5*60*1000);

if(VIEW){
  // 個人查看：先解開自己的資料（裡面有試算表網址），再讀試算表；之後每分鐘更新一次
  renderAll();
  loadView();
  setInterval(()=>{ if(document.visibilityState==='visible'){ loadView(); refresh(true); } },60*1000);
}else{
  if(!sync&&applyDefaults()) saveState(true);
  renderAll();
  renderSync();
  refresh(true);
  if(sync) syncNow();
  setTimeout(publishViews,3000);   // 個人查看連結的內容每次開啟都重放一次（上次可能離線沒放成功）
}
</script>
</body>
</html>
